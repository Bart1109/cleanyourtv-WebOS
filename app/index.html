  --dock-h: 230px;
  --dock-gap: 32px;
  --dock-rad: 36px;

#dock {

}
#dock > * + * {

#grid {
  position: absolute;
  left: var(--grid-l);

  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  background: rgba(var(--night-rgb), var(--ov-dim));
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #scroll::before,
[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;

}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
}
.snap .tile,
.snap .pill {

/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */

}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));
  border: var(--ring-w) solid var(--focus);
  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}
#dock .tile.f::before {
  border-radius: calc(var(--dock-rad) + var(--ring-off) + var(--ring-w));
}

  display: none;
}

function hsl2rgb(h, s, l) {
  var a = s * Math.min(l, 1 - l);
  function f(n) {
    var k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));

    if (!c) return;
    gen++;
    cur = num;
    try {
      localStorage.setItem('live.last', String(num));
    } catch (e) {}
    tuneAt = Date.now();
    streams = [{ url: c.url, q: c.q }].concat(c.alt);
    si = 0;
    reloads = 0;
    failed = false;
    variants = variantsFor(c.url);
    vi = 0;
    layer('lv-msg', false);
    clearTimeout(beginT);
    clearTimeout(spinT);
    clearTimeout(stallT);
    clearTimeout(playedT);
    if (defer) {
      pend = true;
      if (video) {
        try {
          video.pause();
        } catch (e) {}
      }
      layer('lv-spin', true);
      showTune();
      beginT = setTimeout(function () {
        startVariant();
        loadEpg([c.id]);
      }, defer);
    } else {
      startVariant();
      loadEpg([c.id]);
    }
    if (!quiet) showOsd();
    else fillOsd();
  }
  function pickStream(i) {
    var c = byNum[cur];
    if (!c || i < 0 || i >= streams.length) return;
    gen++;
    failed = false;
    si = i;
    reloads = 0;
    variants = variantsFor(streams[si].url);
    vi = 0;
    layer('lv-msg', false);
    startVariant();
  }

  /* ---------- the banner ---------- */
  function hm(ts) {
    var d = new Date(ts * 1000);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function facts(c) {
    var a = [];
    if (c.cc) a.push(cname(c.cc));
    if (c.lang) a.push(c.lang);
    if (c.q) a.push(c.q);
    if (c.alt.length) a.push(c.alt.length + 1 + ' ' + t('streams'));
    return a.join('  ·  ');
  }
  function fillOsd() {
    var c = byNum[cur];
    if (!c) return;
    $('lv-onum').textContent = c.num;
    $('lv-oname').textContent = c.name;
    var lg = $('lv-ologo');
    if (c.logo) {
      lg.src = c.logo;
      lg.style.display = '';
    } else lg.style.display = 'none';
    var e = epgNow[c.id],
      now = Math.floor(Date.now() / 1000),
      f = facts(c);
    if (e && e.now) {
      $('lv-onow').textContent = hm(e.now[0]) + '  ' + e.now[2];
      $('lv-obar').style.width = Math.max(0, Math.min(100, ((now - e.now[0]) / (e.now[1] - e.now[0])) * 100)) + '%';
    } else {
      $('lv-onow').textContent = e ? '' : t('No guide data');
      $('lv-obar').style.width = '0';
    }
    $('lv-onext').textContent = e && e.next ? t('Next') + '  ' + hm(e.next[0]) + '  ' + e.next[2] : f;
    $('lv-ofacts').textContent = e && e.next ? f : '';
  }
  function showOsd() {
    fillOsd();
    layer('lv-osd', true);
    clearTimeout(osdT);
    osdT = setTimeout(function () {
      layer('lv-osd', false);
    }, 5500);
  }
  function loadEpg(ids, cb) {
    ids = ids.filter(function (i) {
      return i;
    });
    if (!ids.length) {
      cb && cb();
      return;
    }
    api('/api/live/epg?ids=' + encodeURIComponent(ids.join(',')))
      .then(function (x) {
        for (var k in x) epgNow[k] = x[k];
        if (byNum[cur] && ids.indexOf(byNum[cur].id) >= 0) fillOsd();
        cb && cb();
      })
      .catch(function () {
        cb && cb();
      });
  }
  setInterval(function () {
    if (o.on && byNum[cur]) loadEpg([byNum[cur].id]);
  }, 30000);

  /* ---------- the guide: tabs, favourites, recents, filters, search ---------- */
  var full = {};
  function cname(code) {
    try {
      if (window.Intl && Intl.DisplayNames) {
        var n = new Intl.DisplayNames([LOC], { type: 'region' }).of(code);
        if (n && n !== code) return n;
      }
    } catch (e) {}
    return code;
  }
  function passes(c) {
    if (F.cc && c.cc !== F.cc) return false;
    if (F.lang && c.lang !== F.lang) return false;
    if (F.q && c.q !== F.q) return false;
    if (Q) {
      var s = (c.name + ' ' + c.cc + ' ' + cname(c.cc || '') + ' ' + c.lang + ' ' + c.cats.join(' ')).toLowerCase();
      if (s.indexOf(Q) < 0) return false;
    }
    return true;
  }
  function baseList(g) {
    if (g === 0) return chans;
    if (g === 1)
      return S.fav
        .map(function (k) {
          return byKey[k];
        })
        .filter(Boolean);
    if (g === 2)
      return S.recent
        .map(function (k) {
          return byKey[k];
        })
        .filter(Boolean);
    var n = groups[g - 3];
    return chans.filter(function (c) {
      return c.cats.indexOf(n) >= 0;
    });
  }
  function listFor(g) {
    return baseList(g).filter(passes);
  }
  function tabNames() {
    return [t('All channels'), t('Favourites'), t('Recent')].concat(groups);
  }
  function gcolor() {
    var n = tabNames()[L.g],
      c = hsl2rgb(hashHue(n), 0.5, 0.42);
    $('lv-glow').style.setProperty('--c', c.join(','));
  }
  function openList() {
    L.open = true;
    var c = byNum[cur];
    L.g = 0;
    if (c && c.cats[0]) {
      var gi = groups.indexOf(c.cats[0]);
      if (gi >= 0) L.g = gi + 3;
    }
    L.list = listFor(L.g);
    L.ci = Math.max(0, L.list.indexOf(c));
    drawList();
    $('lv').classList.add('gd');
    layer('lv-guide', true);
    fetchVisible();
  }
  function closeList() {
    L.open = false;
    endSearch(false);
    FP.open = false;
    layer('lv-filter', false);
    $('lv').classList.remove('gd');
    layer('lv-guide', false);
  }
  function pct(p, now) {
    return Math.max(0, Math.min(100, ((now - p[0]) / (p[1] - p[0])) * 100));
  }
  var STAR = '<svg class="st" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg>';
  function badges(c) {
    var h = '';
    if (isFav(c)) h += STAR;
    if (c.q) h += '<span class="bd">' + c.q + '</span>';
    if (c.fl & 1) h += '<span class="bd w">GEO</span>';
    if (c.fl & 2) h += '<span class="bd w">NOT 24/7</span>';
    if (c.fl & 4) h += '<span class="bd w">HEADERS</span>';
    if (c.alt.length) h += '<span class="bd">×' + (c.alt.length + 1) + '</span>';
    if (c.key && S.failed[c.key]) h += '<span class="bd w">!</span>';
    return h ? '<div class="bds">' + h + '</div>' : '';
  }
  function filterText() {
    var a = [];
    if (F.cc) a.push(cname(F.cc));
    if (F.lang) a.push(F.lang);
    if (F.q) a.push(F.q);
    if (Q) a.push('“' + Q + '”');
    return a.join('  ·  ');
  }
  function drawList() {
    var now = Math.floor(Date.now() / 1000),
      names = tabNames();
    $('lv-gtitle').textContent = t('Live TV');
    var d = new Date(),
      tabs = '';
    if (L.g > 0) tabs += '<div class="ctab m">‹</div><div class="ctab">' + lesc(names[L.g - 1]) + '</div>';
    tabs += '<div class="ctab on">' + lesc(names[L.g]) + '</div>';
    if (L.g < names.length - 1) tabs += '<div class="ctab">' + lesc(names[L.g + 1]) + '</div><div class="ctab m">›</div>';
    var ft = filterText();
    if (ft) tabs += '<div class="ctab f">' + lesc(t('Filters') + ': ' + ft) + '</div>';
    setHtml($('lv-gtabs'), tabs);
    $('lv-gclock').textContent = d.toLocaleTimeString(LOC, clockOpts());
    gcolor();
    var N = 7,
      cs = Math.max(0, Math.min(L.ci - 3, L.list.length - N)),
      h = '';
    for (var j = cs; j < Math.min(L.list.length, cs + N); j++) {
      var c = L.list[j],
        e = epgNow[c.id],
        pn = e && e.now;
      h +=
        '<div class="crow' +
        (j === L.ci ? ' f' : '') +
        (c.num === cur ? ' cur' : '') +
        '"><div class="n">' +
        c.num +
        '</div>' +
        (c.logo ? '<img class="lg" src="' + lesc(c.logo) + '" alt="">' : '<div class="lg"></div>') +
        '<div class="t"><div class="nm">' +
        lesc(c.name) +
        '</div><div class="nw">' +
        (pn ? lesc(hm(pn[0]) + '  ' + pn[2]) : e ? '' : lesc(t('No guide data'))) +
        '</div>' +
        (pn ? '<div class="pbar"><i style="width:' + pct(pn, now) + '%"></i></div>' : '') +
        '</div>' +
        badges(c) +
        '</div>';
    }
    if (!L.list.length)
      h =
        '<div class="empty">' +
        lesc(
          t(
            L.g === 1 && !S.fav.length
              ? 'No favourites yet. Press the green button on a channel.'
              : L.g === 2 && !S.recent.length
                ? 'Nothing watched yet.'
                : 'No channels match.'
          )
        ) +
        '</div>';
    setHtml($('lv-rows'), h);
    drawDetail();
  }
  function drawDetail() {
    var c = L.list[L.ci];
    if (!c) {
      setHtml($('lv-detail'), '');
      return;
    }
    var f = full[c.id],
      now = Math.floor(Date.now() / 1000),
      h =
        '<div class="dn">' +
        lesc(c.name) +
        '</div><div class="dg">' +
        lesc(c.cats.join(', ')) +
        '</div><div class="dg">' +
        lesc(facts(c)) +
        '</div>';
    if (f && f.list && f.list.length) {
      var p = f.list[0],
        live = p[0] <= now;
      h +=
        '<div class="card"><div class="dt">' +
        lesc(hm(p[0]) + ' – ' + hm(p[1])) +
        '</div><div class="dp">' +
        lesc(p[2]) +
        '</div>' +
        (p[3] ? '<div class="dd">' + lesc(p[3]) + '</div>' : '') +
        (live ? '<div class="pbar"><i style="width:' + pct(p, now) + '%"></i></div>' : '') +
        '</div>';
      if (f.list.length > 1) {
        h += '<h3>' + t('Later') + '</h3>';
        for (var i = 1; i < Math.min(5, f.list.length); i++)
          h += '<div class="up"><div class="tm">' + hm(f.list[i][0]) + '</div><div class="tt">' + lesc(f.list[i][2]) + '</div></div>';
      }
    } else h += '<div class="card"><div class="dt">' + lesc(f ? t('No guide data') : '…') + '</div></div>';
    setHtml($('lv-detail'), h);
  }
  function fetchVisible() {
    clearTimeout(fetchT);
    fetchT = setTimeout(function () {
      var cs = Math.max(0, Math.min(L.ci - 3, L.list.length - 7)),
        ids = L.list
          .slice(cs, cs + 7)
          .map(function (c) {
            return c.id;
          })
          .filter(function (i) {
            return i && !epgNow[i];
          });
      if (ids.length)
        loadEpg(ids, function () {
          if (L.open) drawList();
        });
      var c = L.list[L.ci];
      if (c && c.id && !full[c.id])
        api('/api/live/epg?full=1&ids=' + encodeURIComponent(c.id))
          .then(function (x) {
            full[c.id] = x[c.id] || { list: [] };
            if (L.open) drawDetail();
          })
          .catch(function () {});
    }, 160);
  }
  function relist() {
    L.list = listFor(L.g);
    L.ci = 0;
    drawList();
    fetchVisible();
  }

  /* search: the TV's own keyboard types into an input; the list follows what is typed */
  function startSearch() {
    searching = true;
    if (L.g > 2) {
      L.g = 0;
      L.list = listFor(0);
      L.ci = 0;
      drawList();
    } /* a search looks through all channels, not one category */
    var i = $('lv-search');
    i.value = Q;
    i.placeholder = t('Search...');
    i.style.display = 'block';
    i.focus();
  }
  function endSearch(keep) {
    if (!searching) return;
    searching = false;
    var i = $('lv-search');
    if (!keep) {
      Q = '';
      i.value = '';
    }
    i.style.display = 'none';
    i.blur();
    if (L.open) relist();
  }
  $('lv-search').addEventListener('input', function () {
    Q = this.value.trim().toLowerCase();
    if (L.open) relist();
  });

  /* filters */
  function fvals(k) {
    return [''].concat(fac[k]);
  }
  function filterRows() {
    return [
      { k: 'cc', label: t('Country'), val: F.cc ? cname(F.cc) : t('All') },
      { k: 'lang', label: t('Language'), val: F.lang || t('All') },
      { k: 'q', label: t('Quality'), val: F.q || t('All') },
      { k: 'clear', label: t('Clear filters'), val: '' },
    ];
  }
  function drawFilter() {
    var r = filterRows(),
      h = '<h3>' + lesc(t('Filters')) + '</h3>';
    for (var i = 0; i < r.length; i++)
      h +=
        '<div class="mrow' +
        (i === FP.i ? ' f' : '') +
        '"><div class="ml">' +
        lesc(r[i].label) +
        '</div><div class="mv">' +
        (r[i].k === 'clear' ? '' : '‹ ') +
        lesc(r[i].val) +
        (r[i].k === 'clear' ? '' : ' ›') +
        '</div></div>';
    setHtml($('lv-filter'), h);
  }
  function stepFilter(k, d) {
    var v = fvals(k),
      i = v.indexOf(F[k]);
    i = (i + d + v.length) % v.length;
    F[k] = v[i];
    relist();
    drawFilter();
  }
  function filterKey(k) {
    if (k === 38) {
      if (FP.i > 0) FP.i--;
    } else if (k === 40) {
      if (FP.i < 3) FP.i++;
    } else if (k === 37 || k === 39) {
      var r = filterRows()[FP.i];
      if (r.k !== 'clear') stepFilter(r.k, k === 37 ? -1 : 1);
      return;
    } else if (k === 13) {
      var r2 = filterRows()[FP.i];
      if (r2.k === 'clear') {
        F = { cc: '', lang: '', q: '' };
        relist();
      } else FP.open = false;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      FP.open = false;
    }
    if (!FP.open) {
      layer('lv-filter', false);
      drawList();
      return;
    }
    drawFilter();
  }

  /* the player menu (Yellow while watching) */
  function menuItems() {
    var c = byNum[cur],
      it = [
        {
          label: t('Favourite'),
          sub: t(isFav(c) ? 'On' : 'Off'),
          fn: function () {
            toggleFav(c);
            drawMenu();
          },
        },
      ];
    if (streams.length > 1)
      streams.forEach(function (s, i) {
        it.push({
          label: t('Stream') + ' ' + (i + 1) + (s.q ? '  ' + s.q : ''),
          sub: i === si ? '✓' : '',
          fn: function () {
            M.open = false;
            layer('lv-menu', false);
            pickStream(i);
          },
        });
      });
    it.push({
      label: t('Statistics'),
      sub: t(stats ? 'On' : 'Off'),
      fn: function () {
        setStats(!stats);
        drawMenu();
      },
    });
    it.push({
      label: t('Close'),
      sub: '',
      fn: function () {
        M.open = false;
        layer('lv-menu', false);
      },
    });
    return it;
  }
  function drawMenu() {
    M.items = menuItems();
    if (M.i >= M.items.length) M.i = M.items.length - 1;
    var h = '<h3>' + lesc(byNum[cur].name) + '</h3>';
    for (var i = 0; i < M.items.length; i++)
      h +=
        '<div class="mrow' +
        (i === M.i ? ' f' : '') +
        '"><div class="ml">' +
        lesc(M.items[i].label) +
        '</div><div class="mv">' +
        lesc(M.items[i].sub) +
        '</div></div>';
    setHtml($('lv-menu'), h);
  }
  function openMenu() {
    M.open = true;
    M.i = 0;
    drawMenu();
    layer('lv-menu', true);
  }
  function menuKey(k) {
    if (k === 38) {
      if (M.i > 0) M.i--;
    } else if (k === 40) {
      if (M.i < M.items.length - 1) M.i++;
    } else if (k === 13) {
      M.items[M.i].fn();
      return;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      M.open = false;
      layer('lv-menu', false);
      return;
    }
    drawMenu();
  }

  /* statistics (Blue while watching): what the TV tells a web page about the picture */
  function statsText() {
    var v = video;
    if (!v) return '';
    var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null,
      ahead = 0;
    try {
      if (v.buffered && v.buffered.length) ahead = v.buffered.end(v.buffered.length - 1) - v.currentTime;
    } catch (e) {}
    return (
      (v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'no picture') +
      '\n' +
      t('buffer') +
      ' ' +
      ahead.toFixed(1) +
      ' s\n' +
      (q ? t('frames') + ' ' + q.totalVideoFrames + ', ' + t('dropped') + ' ' + q.droppedVideoFrames + '\n' : '') +
      t('Stream') +
      ' ' +
      (si + 1) +
      '/' +
      streams.length +
      (reloads ? '  (' + t('reloaded') + ')' : '')
    );
  }
  function setStats(on) {
    stats = on;
    clearInterval(statsT);
    layer('lv-stats', on);
    if (on) {
      $('lv-stats').textContent = statsText();
      statsT = setInterval(function () {
        $('lv-stats').textContent = statsText();
      }, 1000);
    }
  }

  function digit(d) {
    numBuf += d;
    if (numBuf.length > 5) numBuf = numBuf.slice(-5);
    $('lv-numin').textContent = numBuf;
    layer('lv-numin', true);
    clearTimeout(numT);
    numT = setTimeout(function () {
      var n = parseInt(numBuf, 10);
      numBuf = '';
      layer('lv-numin', false);
      if (byNum[n]) play(n);
      else showOsd();
    }, 1800);
  }
  function setup() {
    api('/api/live/pair', {}).then(function (p) {
      msg(
        '<b>' +
          t('Set up Live TV') +
          '</b><div>' +
          t('Open this address on your phone or computer:') +
          '</div><b>' +
          lesc(p.url) +
          '</b><div>' +
          t('and enter this code:') +
          '</div><b>' +
          lesc(p.code) +
          '</b><div class="small">' +
          t('Then paste your M3U playlist address. This page closes by itself.') +
          '</div>'
      );
      clearInterval(setupT);
      setupT = setInterval(function () {
        if (!o.on) {
          clearInterval(setupT);
          return;
        }
        api('/api/live/status').then(function (s) {
          if (s.configured) {
            clearInterval(setupT);
            boot();
          }
        });
      }, 2500);
    });
  }
  function facets() {
    function top(k) {
      var n = {};
      chans.forEach(function (c) {
        if (c[k]) n[c[k]] = (n[c[k]] || 0) + 1;
      });
      return Object.keys(n)
        .sort(function (a, b) {
          return n[b] - n[a] || (a < b ? -1 : 1);
        })
        .slice(0, 40);
    }
    fac = {
      cc: top('cc'),
      lang: top('lang'),
      q: ['SD', 'HD', 'FHD', '4K'].filter(function (q) {
        return chans.some(function (c) {
          return c.q === q;
        });
      }),
    };
  }
  function boot() {
    msg('<div>' + t('Loading channels...') + '</div>');
    api('/api/live/status')
      .then(function (s) {
        if (!s.configured) {
          setup();
          return;
        }
        var tries = 0;
        (function load() {
          if (!o.on) return;
          api('/api/live/channels').then(function (x) {
            if (!x.channels.length) {
              if (++tries > 40) {
                msg('<div>' + lesc(s.error || 'No channels') + '</div>');
                return;
              }
              setTimeout(load, 2000);
              return;
            }
            groups = x.groups;
            chans = x.channels.map(function (r) {
              return {
                num: r[0],
                id: r[1],
                name: r[2],
                group: r[3],
                logo: r[4],
                url: r[5],
                key: r[6] || '',
                cc: r[7] || '',
                lang: r[8] || '',
                q: r[9] || '',
                fl: r[10] || 0,
                cats: r[11] || (r[3] ? [r[3]] : []),
                alt: (r[12] || []).map(function (a) {
                  return { url: a[0], q: a[1] };
                }),
              };
            });
            byNum = {};
            byKey = {};
            chans.forEach(function (c) {
              byNum[c.num] = c;
              if (c.key) byKey[c.key] = c;
            });
            loaded = true;
            facets();
            var last = 0;
            try {
              last = parseInt(localStorage.getItem('live.last'), 10);
            } catch (e) {}
            api('/api/live/state')
              .then(
                function (st) {
                  S = { fav: st.fav || [], recent: st.recent || [], failed: st.failed || {} };
                },
                function () {}
              )
              .then(function () {
                layer('lv-msg', false);
                play(byNum[last] ? last : chans[0].num);
                if (guideNext) {
                  guideNext = false;
                  openList();
                }
              });
          });
        })();
      })
      .catch(function () {
        msg('<div>' + t('The helper is not reachable.') + '</div>');
        setTimeout(function () {
          if (o.on) boot();
        }, 3000);
      });
  }
  function step(d) {
    var i = chans.indexOf(byNum[cur]);
    i = (i + d + chans.length) % chans.length;
    play(chans[i].num, false, 180);
  }
  var guideNext = false;
  o.enter = function (guide) {
    o.on = true;
    guideNext = !!guide;
    $('lv').classList.add('on');
    if (loaded && byNum[cur]) {
      play(cur);
      if (guideNext) {
        guideNext = false;
        openList();
      }
    } else boot();
  };
