<!doctype html>
<html><head><meta charset="utf-8"><title>Home</title>
<meta name="viewport" content="width=1920">
<style>
/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. */
:root{
  --ink:#f5f6f8; --ink2:rgba(245,246,248,.62); --night:#07080b; --panel:#14161b;
  --font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font)}
::selection{background:rgba(255,255,255,.25)}

.glow{position:absolute;left:0;top:0;width:1920px;height:720px;opacity:0;transition:opacity .35s linear;will-change:opacity;
  background:radial-gradient(ellipse 1400px 640px at 26% -6%,rgba(var(--c),.45),transparent 70%)}
.glow.on{opacity:1}

#top{position:absolute;left:96px;right:96px;top:54px;height:76px;display:flex;align-items:center;z-index:5}
#time{font-size:56px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:28px;color:rgba(245,246,248,.88);margin-left:22px;padding-top:14px}
#top .sp{flex:1}
#bar{display:flex}
.pill{display:flex;align-items:center;gap:14px;height:64px;padding:0 30px 0 24px;margin-left:16px;border-radius:32px;font-size:26px;font-weight:500;
  background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);transition:transform .15s ease-out;will-change:transform}
.pill svg{width:30px;height:30px;flex:none}
.pill.f{background:var(--ink);color:#0b0c10;transform:scale(1.07)}

#shelf{position:absolute;left:96px;right:96px;top:150px;height:120px;z-index:5}
#name{font-size:92px;font-weight:700;letter-spacing:-.028em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the view clips rows as they scroll up under the shelf */
#view{position:absolute;left:0;top:300px;width:1920px;height:780px;overflow:hidden;z-index:2}
#scroll{position:absolute;left:0;top:0;width:1920px;height:780px;transition:transform .3s ease-out;will-change:transform}
#dock{position:absolute;left:96px;top:60px;display:flex;gap:32px}
#grid{position:absolute;left:96px;top:350px;width:1728px;display:grid;grid-template-columns:repeat(10,151px);gap:26px 24px}

.tile{--c:74,84,112;--b:20,22,27;position:relative;display:flex;align-items:center;justify-content:center;will-change:transform;
  background:rgb(var(--b));transition:transform .15s ease-out}
.tile img{object-fit:contain}
.tile svg{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tile .t{font-size:26px;font-weight:600;padding:12px;text-align:center;line-height:1.15;opacity:.9}
.tile.f{z-index:3;outline:4px solid rgba(255,255,255,.95);outline-offset:4px;box-shadow:0 24px 36px rgba(0,0,0,.6)}
#dock .tile{width:408px;height:230px;border-radius:36px}
#dock .tile img{height:56%;max-width:46%}
#dock .tile svg{width:96px;height:96px}
#dock .tile.f{transform:translateY(-10px) scale(1.05)}
#grid .tile{height:151px;border-radius:34px}
#grid .tile img{width:64%;height:64%}
#grid .tile svg{width:64px;height:64px}
#grid .tile.f{transform:scale(1.12)}
#grid .tile.sys{flex-direction:column;gap:8px}
.slab{font-size:22px;font-weight:600;color:var(--ink2)}
#grid .tile.sys{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

#toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:40;padding:18px 38px;border-radius:34px;font-size:28px;
  background:#14161b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);opacity:0;pointer-events:none}
#toast.on{opacity:1}

/* menus */
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:30;background:rgba(5,6,9,.97);display:flex;align-items:center;justify-content:center}
#ov .panel{width:760px;display:flex;flex-direction:column;gap:12px}
#ov h2{font-size:46px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:22px;height:84px;padding:0 34px;border-radius:30px;font-size:30px;font-weight:500;
  background:#1a1c22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.row svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:22px;opacity:.65}
.row.dim{opacity:.6}
.row.f{background:var(--ink);color:#0b0c10;opacity:1}
.more{height:22px;text-align:center;font-size:20px;color:var(--ink2)}

/* Live TV (inside the launcher) */
#lv{--ink2:rgba(245,246,248,.76);position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:60;background:#000;display:none}
#lv.on{display:block}
#lv-stage,#lv-stage video{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000}
#lv .layer{position:absolute;opacity:0;pointer-events:none;transition:opacity .2s linear}
#lv .layer.on{opacity:1}
/* channel banner: a floating panel in the launcher's style */
#lv-osd{left:96px;right:96px;bottom:64px;height:232px;border-radius:44px;padding:0 44px 0 36px;display:flex;align-items:center;gap:32px;
  background:rgba(12,13,17,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 30px 60px rgba(0,0,0,.5)}
#lv-osd .logo{width:150px;height:150px;border-radius:34px;background:#1c1e24;object-fit:contain;flex:none}
#lv-osd .num{font-size:92px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;min-width:120px;flex:none}
#lv-osd .info{flex:1;min-width:0}
#lv-osd .name{font-size:50px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lv-osd .now{font-size:32px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lv-osd .next{font-size:26px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:currentColor;width:0}
#lv-osd .pbar{margin-top:16px;color:var(--ink)}
#lv-numin{right:96px;top:64px;font-size:88px;font-weight:700;font-variant-numeric:tabular-nums}
#lv-msg{left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;font-size:34px}
#lv-msg.on{background:rgba(0,0,0,.62)}
#lv-msg b{font-size:56px;letter-spacing:-.02em}
#lv-msg .small{font-size:26px;color:var(--ink2);max-width:1100px}
#lv.gd #lv-spin{visibility:hidden}
#lv-spin{left:932px;top:512px;width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;animation:lvsp 1s linear infinite}
@keyframes lvsp{to{transform:rotate(360deg)}}
/* guide screen (OK) */
#lv-guide{left:0;top:0;width:1920px;height:1080px;background:rgba(7,8,11,.9)}
#lv-glow{position:absolute;left:0;top:0;width:1920px;height:720px;background:radial-gradient(ellipse 1400px 640px at 26% -6%,rgba(var(--c),.3),transparent 70%)}
#lv-gtop{position:absolute;left:96px;right:96px;top:54px;height:76px;display:flex;align-items:center;gap:36px}
#lv-gtitle{font-size:56px;font-weight:700;letter-spacing:-.02em;flex:none}
#lv-gtabs{flex:1;display:flex;gap:14px;overflow:hidden;align-items:center}
.ctab{height:56px;padding:0 26px;max-width:340px;overflow:hidden;text-overflow:ellipsis;border-radius:28px;font-size:25px;font-weight:500;display:flex;align-items:center;white-space:nowrap;flex:none;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.ctab.on{background:var(--ink);color:#0b0c10}
.ctab.m{background:none;box-shadow:none;color:var(--ink2);padding:0 6px}
#lv-gclock{font-size:56px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:none}
#lv-rows{position:absolute;left:96px;top:196px;width:900px}
.crow{display:flex;align-items:center;gap:22px;height:104px;margin-bottom:12px;padding:0 28px 0 18px;border-radius:30px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.crow .lg{width:72px;height:72px;border-radius:20px;background:#1c1e24;object-fit:contain;flex:none}
.crow .n{width:78px;font-size:27px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.crow .t{flex:1;min-width:0}
.crow .nm{font-size:30px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .nw{font-size:24px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .pbar{margin-top:9px;height:6px;color:var(--ink)}
.crow.cur .n{color:var(--ink)}
.crow.f{background:var(--ink);color:#0b0c10;box-shadow:0 20px 34px rgba(0,0,0,.5)}
.crow.f .n,.crow.f .nw{color:rgba(11,12,16,.62)}
.crow.f .pbar{background:rgba(11,12,16,.18);color:#0b0c10}
.crow.f .lg{background:#e9ebef}
.cmore{height:22px;text-align:center;font-size:20px;color:var(--ink2);width:900px;position:absolute;left:0}
#lv-detail{position:absolute;left:1070px;top:196px;width:754px}
#lv-detail .dn{font-size:64px;font-weight:700;letter-spacing:-.025em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lv-detail .dg{font-size:24px;color:var(--ink2);margin-top:6px}
#lv-detail .card{margin-top:30px;padding:30px 34px;border-radius:36px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#lv-detail .dt{font-size:24px;color:var(--ink2);font-variant-numeric:tabular-nums}
#lv-detail .dp{font-size:42px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.12;max-height:96px;overflow:hidden}
#lv-detail .dd{font-size:26px;color:rgba(245,246,248,.82);margin-top:14px;line-height:1.35;max-height:140px;overflow:hidden}
#lv-detail .card .pbar{margin-top:20px;color:var(--ink)}
#lv-detail h3{font-size:26px;font-weight:600;color:var(--ink2);margin:30px 0 10px}
#lv-detail .up{display:flex;gap:22px;font-size:27px;height:50px;align-items:center;white-space:nowrap}
#lv-detail .up .tm{width:86px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
#lv-detail .up .tt{overflow:hidden;text-overflow:ellipsis}

var LIVE_ONLY=((window.webOSSystem&&webOSSystem.identifier)||'')==='com.cleanyourtv.live', QUIET=false;   /* the same page installed as its own app (for the native launcher): Live TV only, Back goes Home */
var apps=[], cfg={}, usage={}, warned=false, rows=[], r=1, c=0, colors={}, tiles={}, lastSig='', gSide=0, gColor='', gT=0, saveT=0;
function $(id){return document.getElementById(id)}
var toastT;
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},4000)}
var MIN_SERVICE='1.4.3';
function oldSvc(v){var a=String(v).split('.'),b=MIN_SERVICE.split('.');for(var i=0;i<3;i++){var x=+a[i]||0,y=+b[i]||0;if(x!==y)return x<y}return false}
function api(p,body){return fetch(API+p,body?{method:'POST',body:JSON.stringify(body)}:{}).then(function(x){return x.json()})}
function launch(id,params){if(id==='__live')return LIVE.enter();api('/api/launch',{id:id,params:params}).then(function(x){if(x&&x.returnValue===false)toast(t('Could not open')+' '+id)})}

/* ---------- colour (extracted once per app, then remembered) ---------- */
function hsl2rgb(h,s,l){var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))}return [f(0),f(8),f(4)]}
function rgb2hsl(R,G,B){R/=255;G/=255;B/=255;var mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===R?((G-B)/d+(G<B?6:0)):mx===G?(B-R)/d+2:(R-G)/d+4;h*=60}return [h,s,l]}
function hashHue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}
/* returns {c: vibrant colour for the glow, b: the icon's own edge colour for the tile background} */
function iconColor(img,id){
  var glow=null,edge=null,N=16;
  try{
    var cv=document.createElement('canvas');cv.width=cv.height=N;var x=cv.getContext('2d');x.drawImage(img,0,0,N,N);
    var d=x.getImageData(0,0,N,N).data,R=0,G=0,B=0,W=0,eR=0,eG=0,eB=0,eN=0,ring=0;
    for(var y=0;y<N;y++)for(var xx=0;xx<N;xx++){
      var i=(y*N+xx)*4,a=d[i+3]/255;
      if(y===0||y===N-1||xx===0||xx===N-1){ring++;if(a>.8){eR+=d[i];eG+=d[i+1];eB+=d[i+2];eN++}}
      if(a<.4)continue;var hs=rgb2hsl(d[i],d[i+1],d[i+2]);var w=a*(.15+hs[1]*hs[1]);R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}
    if(eN>ring*.5)edge=[Math.round(eR/eN),Math.round(eG/eN),Math.round(eB/eN)];
    if(W>0.5){var h=rgb2hsl(R/W,G/W,B/W);if(h[1]>.22)glow=hsl2rgb(h[0],Math.max(.5,Math.min(h[1],.8)),Math.max(.36,Math.min(h[2],.52)))}
  }catch(e){}
  var fb=hsl2rgb(hashHue(id),.42,.42);
  glow=glow||(edge&&rgb2hsl(edge[0],edge[1],edge[2])[1]>.3?edge:fb);
  return {c:glow,b:edge||hsl2rgb(rgb2hsl(glow[0],glow[1],glow[2])[0],.4,.2)}}
function paint(d,col){d.style.setProperty('--c',col.c.join(','));d.style.setProperty('--b',col.b.join(','))}

/* ---------- tiles (built once per app, reused across rebuilds) ---------- */
function tile(a){
  if(tiles[a.id])return tiles[a.id];
  var d=document.createElement('div');d.className='tile'+(a.sys?' sys':'');d._a=a;
  tiles[a.id]=d;hit(d);
  if(a.sys){d.innerHTML=svg(a.icon)+'<div class="slab">'+'LG Home'+'</div>';return d}
  var known=colors[a.id];
  if(known)paint(d,known);
  var i=new Image();i.alt='';i.decoding='async';
  if(!known)i.crossOrigin='anonymous';
  i.onload=function(){if(!colors[a.id]){colors[a.id]=iconColor(i,a.id);paint(d,colors[a.id]);storeSoon();if(rows[r]&&rows[r][c]===d)glowNow(d)}};
  i.onerror=function(){i.remove();var t=document.createElement('div');t.className='t';t.textContent=a.title;d.appendChild(t);
    if(!colors[a.id]){var f=hsl2rgb(hashHue(a.id),.42,.42);colors[a.id]={c:f,b:hsl2rgb(hashHue(a.id),.4,.2)};paint(d,colors[a.id])}};
  i.src=a.id==='__live'?LIVE_ICON:API+'/icon/'+encodeURIComponent(a.id);d.appendChild(i);
  return d}

/* ---------- ambient glow: two layers cross-fade, updated only once focus settles ---------- */
function glowNow(e){
  var col=e.style.getPropertyValue('--c')||'74,84,112';
  if(col===gColor)return;gColor=col;
  var on=gSide?$('gB'):$('gA'),off=gSide?$('gA'):$('gB');gSide^=1;
  on.style.setProperty('--c',col);on.classList.add('on');off.classList.remove('on')}
function glowSoon(e){clearTimeout(gT);gT=setTimeout(function(){glowNow(e)},110)}

function setFocus(nr,nc,first){
  var old=rows[r]&&rows[r][c];if(old)old.classList.remove('f');
  r=nr;c=Math.min(nc,rows[r].length-1);var e=rows[r][c];e.classList.add('f');
  var a=e._a,nm=a?a.title:(e._o?barLabel(e._o):''),n=$('name');
  if(n.textContent!==nm)n.textContent=nm;
  if(first)glowNow(e);else glowSoon(e);
  var sh=0;
  if(r>=2){var g=$('grid');sh=Math.min(0,Math.max(50-(350+e.offsetTop),726-(350+g.offsetHeight)))}
  $('scroll').style.transform=sh?'translateY('+sh+'px)':''}
function mapCol(from,to,col){return from>1?Math.round(col*(to-1)/(from-1)):0}
function posOf(e){for(var i=0;i<rows.length;i++){var j=rows[i].indexOf(e);if(j>=0)return [i,j]}return null}

/* ---------- config (edited in the launcher, saved through the helper) ---------- */
function saveCfg(){api('/api/config',cfg).catch(function(){toast(t('Could not save settings'))});store();rebuild()}
function isHidden(id){return (cfg.hidden||[]).indexOf(id)>=0}
function dockIds(){var by={};apps.forEach(function(a){by[a.id]=a});
  var ids=cfg.dock&&cfg.dock.length?cfg.dock:DEFAULTS.dock;
  return ids.filter(function(i){return by[i]&&!isHidden(i)}).slice(0,4)}
function setDock(ids){cfg.dock=ids.slice(0,4);saveCfg()}
function hideApp(id){cfg.hidden=(cfg.hidden||[]).concat(id);cfg.dock=dockIds().filter(function(i){return i!==id});saveCfg()}
function unhideApp(id){cfg.hidden=(cfg.hidden||[]).filter(function(i){return i!==id});saveCfg()}
function topbar(){return cfg.topbar?cfg.topbar:DEFAULTS.topbar}
function byOrder(a,b){
  if(cfg.sort!=='alpha'){var d=(usage[b.id]||0)-(usage[a.id]||0);if(Math.abs(d)>1e-9)return d>0?1:-1}
  return a.title.localeCompare(b.title)}
function title(id){for(var i=0;i<apps.length;i++)if(apps[i].id===id)return apps[i].title;return id}

/* ---------- actions ---------- */
function act(e){
  var a=e._a;
  if(a){
    if(a.id==='__undo'){toast(t('Switching to LG Home: the TV restarts...'));return void api('/api/undo',{})}
    return launch(a.id)}
  var o=e._o||{};
  if(o.action==='customize')return customizeMenu();
  if(o.action==='live')return LIVE.enter();
  if(o.action==='inputs')return inputsMenu();
  if(o.app)launch(o.app,o.params)}

/* ---------- menus ---------- */
var stack=[], ovEl=null;
function openMenu(title,items){stack.push({title:title,items:items,idx:0});drawMenu()}
function closeMenus(){stack=[];if(ovEl){ovEl.remove();ovEl=null}}
function backMenu(){stack.pop();if(stack.length)drawMenu();else closeMenus()}
function drawMenu(){
  var m=stack[stack.length-1],N=8,start=Math.max(0,Math.min(m.idx-3,m.items.length-N));
  if(!ovEl){ovEl=document.createElement('div');ovEl.id='ov';document.body.appendChild(ovEl)}
  var h='<div class="panel"><h2></h2><div class="more">'+(start>0?'▲':'')+'</div>';
  for(var i=start;i<Math.min(m.items.length,start+N);i++){
    var it=m.items[i];
    h+='<div class="row'+(i===m.idx?' f':'')+(it.dim?' dim':'')+'" data-i="'+i+'">'+(it.icon?svg(it.icon):'')+'<span class="lb"></span>'+(it.sub?'<span class="st"></span>':'')+'</div>'}
  h+='<div class="more">'+(start+N<m.items.length?'▼':'')+'</div></div>';
  ovEl.innerHTML=h;
  ovEl.querySelector('h2').textContent=m.title;
  [].forEach.call(ovEl.querySelectorAll('.row'),function(row){
    var it=m.items[+row.getAttribute('data-i')];
    row.querySelector('.lb').textContent=it.label;
    if(it.sub)row.querySelector('.st').textContent=it.sub;
    row.addEventListener('click',function(){m.idx=+row.getAttribute('data-i');pickMenu()})})}
function pickMenu(){var m=stack[stack.length-1],it=m.items[m.idx];if(it&&it.fn){var n=stack.length;it.fn();if(stack.length===n&&!it.stay)closeMenus()}}
function menuKey(k){
  var m=stack[stack.length-1];
  if(k===38&&m.idx>0){m.idx--;drawMenu()}
  else if(k===40&&m.idx<m.items.length-1){m.idx++;drawMenu()}
  else if(k===13)pickMenu();
  else if(k===461||k===27||k===8)backMenu();
  else return false;
  return true}

function inputsMenu(){api('/api/inputs').then(function(x){
  var items=(x.devices||[]).filter(function(d){return d.appId}).map(function(d){
    var port='HDMI '+d.port,named=d.label&&d.label!==port&&d.label!==('HDMI '+d.port),parts=[];
    if(named)parts.push(port);
    if(d.hdmiPlugIn)parts.push(t('Connected'));
    if(d.activate)parts.push(t('Active'));
    return {icon:'hdmi',label:d.label||port,sub:parts.join(' \u00B7 '),dim:!d.hdmiPlugIn,fn:function(){launch(d.appId)}}});
  openMenu(t('Inputs'),items)})}

function appMenu(a){
  var di=dockIds(),pos=di.indexOf(a.id),items=[{label:t('Open'),fn:function(){launch(a.id)}}];
  if(pos>=0){
    if(pos>0)items.push({label:t('Move left in dock'),fn:function(){var d=di.slice();d.splice(pos,1);d.splice(pos-1,0,a.id);setDock(d)}});
    if(pos<di.length-1)items.push({label:t('Move right in dock'),fn:function(){var d=di.slice();d.splice(pos,1);d.splice(pos+1,0,a.id);setDock(d)}});
    items.push({label:t('Remove from dock'),fn:function(){setDock(di.filter(function(i){return i!==a.id}))}})}
  else if(di.length<4)items.push({label:t('Add to dock'),fn:function(){setDock(di.concat(a.id))}});
  else items.push({label:t('Add to dock...'),stay:true,fn:function(){
    openMenu(t('Replace which app?'),di.map(function(id,i){return {label:title(id),fn:function(){var d=di.slice();d[i]=a.id;setDock(d)}}}))}});
  items.push({label:t('Hide app'),fn:function(){hideApp(a.id)}});
  openMenu(a.title,items)}

function removeButton(o){cfg.topbar=topbar().filter(function(b){return b!==o});saveCfg()}
function barMenu(o){openMenu(barLabel(o),[{label:t('Remove this button'),fn:function(){removeButton(o)}}])}

function customizeMenu(){
  openMenu(t('Customise'),[
    {label:'Dock',sub:t('hold OK on an app'),stay:true,fn:function(){toast(t('Hold OK on any app to change the dock'))}},
    {label:t('Top buttons'),stay:true,fn:topButtonsMenu},
    {label:t('Hidden apps'),stay:true,fn:hiddenMenu},
    {label:t('App order'),sub:cfg.sort==='alpha'?t('A to Z'):t('Most used first'),fn:function(){cfg.sort=cfg.sort==='alpha'?'usage':'alpha';saveCfg()}},
    {label:t('Clock'),sub:cfg.clock==='24'?t('24-hour'):cfg.clock==='12'?t('12-hour'):t('Automatic'),fn:function(){cfg.clock=cfg.clock==='24'?'12':cfg.clock==='12'?'auto':'24';saveCfg();tick()}},
    {label:t('Reset customisation'),fn:function(){cfg={};saveCfg()}}])}
function topButtonsMenu(){
  var items=topbar().map(function(o){return {label:barLabel(o),sub:t('OK to remove'),fn:function(){removeButton(o)}}});
  items.push({label:t('Add a button...'),stay:true,fn:addButtonMenu});
  openMenu(t('Top buttons'),items)}
function addButtonMenu(){
  var items=PRESETS.map(function(p){return {icon:p.icon,label:barLabel(p),fn:function(){cfg.topbar=topbar().concat([p]);saveCfg()}}});
  items.push({label:t('An app...'),stay:true,fn:function(){
    openMenu(t('Pick an app'),apps.slice().sort(function(a,b){return a.title.localeCompare(b.title)}).map(function(a){
      return {label:a.title,fn:function(){cfg.topbar=topbar().concat([{label:a.title,icon:'grid',app:a.id}]);saveCfg()}}}))}});
  openMenu(t('Add a button'),items)}
function hiddenMenu(){
  var h=(cfg.hidden||[]).filter(function(id){return apps.some(function(a){return a.id===id})});
  if(!h.length)return toast(t('No hidden apps'));
  openMenu(t('Hidden apps (OK to show again)'),h.map(function(id){return {label:title(id),fn:function(){unhideApp(id)}}}))}

/* ---------- layout ---------- */
function rebuild(){
  var by={};apps.forEach(function(a){by[a.id]=a});
  var di=dockIds(),dock=di.map(function(i){return by[i]});
  var rest=apps.filter(function(a){return !isHidden(a.id)&&di.indexOf(a.id)<0}).sort(byOrder);
  rest.push({id:'__undo',title:t('Restore LG Home'),sys:true,icon:'restore'});
  var oldE=rows[r]&&rows[r][c],keep=oldE&&oldE._a?oldE._a.id:null;
  if(oldE)oldE.classList.remove('f');
  var dk=$('dock'),gd=$('grid'),bar=$('bar');
  dk.textContent='';gd.textContent='';bar.textContent='';
  var d=dock.map(function(a){var t=tile(a);dk.appendChild(t);return t});
  var g=rest.map(function(a){var t=tile(a);gd.appendChild(t);return t});
  var tb=topbar().concat([{label:'Customise',icon:'edit',action:'customize',fixed:true}]).map(function(o){
    var p=document.createElement('div');p.className='pill';p._o=o;p.innerHTML=svg(o.icon)+'<span></span>';p.lastChild.textContent=barLabel(o);
    hit(p);bar.appendChild(p);return p});
  rows=[tb,d.length?d:tb];
  for(var i=0;i<g.length;i+=10)rows.push(g.slice(i,i+10));
  var nr=Math.min(r,rows.length-1),nc=c;
  if(keep&&tiles[keep]){var p=posOf(tiles[keep]);if(p){nr=p[0];nc=p[1]}}
  setFocus(nr,nc,true)}

function load(){api('/api/apps').then(function(x){
  if(x.version&&oldSvc(x.version)&&!warned){warned=true;toast('The service ('+x.version+') is older than this launcher needs: update it in the CleanYourTV manager')}
  usage=x.usage||{};
  var rank=Object.keys(usage).sort(function(a,b){return usage[b]-usage[a]});
  var sig=JSON.stringify([x.apps.map(function(a){return a.id}),x.config,rank]);
  if(sig===lastSig)return;lastSig=sig;
  apps=x.apps.map(function(a){return {id:a.id,title:a.title}});apps.push({id:'__live',title:t('Live TV')});cfg=x.config||{};store();rebuild()
}).catch(function(){toast(t('Helper not reachable, retrying...'));setTimeout(load,3000)})}

/* ---------- input: tap OK to open, hold OK for options ---------- */
var downT=0,held=false,downEnter=false,swallowUp=false,pressT=0,lastKey=0,lastMX=-1,lastMY=-1,lastEnter=0;
function hit(e){
  e.addEventListener('mousedown',function(){held=false;clearTimeout(pressT);pressT=setTimeout(function(){held=true;options(e)},650)});
  e.addEventListener('mouseup',function(){clearTimeout(pressT)});
  e.addEventListener('click',function(){if(held){held=false;return}act(e)})}
function options(e){
  if(e._a&&!e._a.sys)appMenu(e._a);
  else if(e._o&&!e._o.fixed)barMenu(e._o)}

/* Pointer focus follows real pointer movement only: a tile sliding under a still cursor, a cursor jitter when
   the remote is picked up, or a pointer move right after a button press must not steal the focus. */
document.addEventListener('mousemove',function(ev){
  if(stack.length||LIVE.on||Date.now()-lastKey<1500)return;
  if(lastMX<0){lastMX=ev.clientX;lastMY=ev.clientY;return}
  if(Math.abs(ev.clientX-lastMX)+Math.abs(ev.clientY-lastMY)<24)return;
  lastMX=ev.clientX;lastMY=ev.clientY;
  var el=ev.target.closest?ev.target.closest('.tile,.pill'):null,p=el&&posOf(el);
  if(p&&!(p[0]===r&&p[1]===c))setFocus(p[0],p[1])});

document.addEventListener('keydown',function(e){
  var k=e.keyCode;lastKey=Date.now();
  if(LIVE.on){LIVE.key(e);return}
  if(stack.length){
    if(k===13){if(downEnter&&Date.now()-lastEnter<1500){lastEnter=Date.now();e.preventDefault();return}downEnter=true;lastEnter=Date.now();swallowUp=true}
    if(menuKey(k))e.preventDefault();return}
  var len=rows[r].length;
  if(k===37&&c>0)setFocus(r,c-1);
  else if(k===39&&c<len-1)setFocus(r,c+1);
  else if(k===38&&r>0)setFocus(r-1,mapCol(len,rows[r-1].length,c));
  else if(k===40&&r<rows.length-1)setFocus(r+1,mapCol(len,rows[r+1].length,c));
  else if(k===13){
    /* webOS repeats keydown while OK is held, sometimes without e.repeat: only the first one starts the hold timer */
    if(!downEnter||Date.now()-lastEnter>1500){downEnter=true;held=false;clearTimeout(downT);var t=rows[r][c];downT=setTimeout(function(){held=true;options(t)},650)}
    lastEnter=Date.now()}
  else return;
  e.preventDefault()});
document.addEventListener('keyup',function(e){
  if(e.keyCode!==13)return;
  lastKey=Date.now();clearTimeout(downT);
  if(swallowUp){swallowUp=false;downEnter=false;return}
  if(downEnter&&!held)act(rows[r][c]);
  downEnter=false;held=false});
/* launching Home with {inputs:true} opens the Inputs list */
function wantInputs(){var p={};try{p=JSON.parse(webOSSystem.launchParams||'{}')}catch(e){}
  if(p&&p.inputs){closeMenus();inputsMenu()}
  else if(p&&p.live||LIVE_ONLY&&!(p&&p.inputs)){closeMenus();LIVE.enter()}}
document.addEventListener('webOSRelaunch',function(){if(LIVE.on)LIVE.exit();load();wantInputs()});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(LIVE.on){QUIET=true;LIVE.exit();QUIET=false}}else load()});

function tick(){var d=new Date();
  try{$('time').textContent=d.toLocaleTimeString(LOC,clockOpts());$('date').textContent=d.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'})}
  catch(e){$('time').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}}
setInterval(tick,15000);tick();


/* ---------- Live TV (plays the user's M3U playlist in the TV's own video player) ---------- */
var LIVE_ICON='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130"><rect width="130" height="130" fill="#ef4f5f"/><rect x="25" y="36" width="80" height="54" rx="13" fill="none" stroke="#fff" stroke-width="8"/><path d="M58 52 L58 74 L77 63 Z" fill="#fff"/><path d="M48 104 H82" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>');
var LIVE=(function(){
  var chans=[],groups=[],byNum={},cur=0,epgNow={},video=null,variants=[],vi=0,osdT=0,numT=0,numBuf='',spinT=0,failed=false,loaded=false,setupT=0,fetchT=0;
  var L={open:false,g:0,col:'c',ci:0,list:[]},o={on:false};
  function lesc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function layer(id,on){$(id).classList.toggle('on',!!on)}
  function msg(h){$('lv-msg').innerHTML=h;layer('lv-msg',true)}
  function variantsFor(url){var v=[];if(/\/live\/.+\.ts(\?|$)/.test(url))v.push({src:url.replace(/\.ts(\?|$)/,'.m3u8$1'),type:'application/x-mpegURL'});v.push({src:url,type:'application/x-mpegURL'});v.push({src:url,type:''});return v}
  function stop(){clearTimeout(spinT);if(video){try{video.pause();video.removeAttribute('src');video.load()}catch(e){}video=null}$('lv-stage').innerHTML=''}
  function startVariant(){
    stop();
    var v=document.createElement('video');v.autoplay=true;video=v;
    var d=variants[vi],src=document.createElement('source');src.src=d.src;if(d.type)src.type=d.type;v.appendChild(src);
    $('lv-stage').appendChild(v);layer('lv-spin',true);
    v.addEventListener('playing',function(){if(v===video)layer('lv-spin',false)});
    v.addEventListener('waiting',function(){if(v===video)layer('lv-spin',true)});
    v.addEventListener('error',function(){if(v!==video)return;if(vi<variants.length-1){vi++;startVariant()}else{layer('lv-spin',false);failed=true;msg('<b>'+lesc(byNum[cur].name)+'</b><div>'+t('This channel is not available.')+'</div><div class="small">'+t('Press OK to try again.')+'</div>')}});
    spinT=setTimeout(function(){if(v===video&&v.readyState<3&&!failed)v.dispatchEvent(new Event('error'))},20000)}
  function play(num,quiet){
    var c=byNum[num];if(!c)return;
    cur=num;try{localStorage.setItem('live.last',String(num))}catch(e){}
    failed=false;variants=variantsFor(c.url);vi=0;layer('lv-msg',false);startVariant();
    if(!quiet)showOsd();else fillOsd();loadEpg([c.id])}
  function hm(ts){var d=new Date(ts*1000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  function fillOsd(){
    var c=byNum[cur];if(!c)return;
    $('lv-onum').textContent=c.num;$('lv-oname').textContent=c.name;
    var lg=$('lv-ologo');if(c.logo){lg.src=c.logo;lg.style.display=''}else lg.style.display='none';
    var e=epgNow[c.id],now=Math.floor(Date.now()/1000);
    if(e&&e.now){$('lv-onow').textContent=hm(e.now[0])+'  '+e.now[2];$('lv-obar').style.width=Math.max(0,Math.min(100,(now-e.now[0])/(e.now[1]-e.now[0])*100))+'%'}
    else{$('lv-onow').textContent=e?'':t('No guide data');$('lv-obar').style.width='0'}
    $('lv-onext').textContent=e&&e.next?t('Next')+'  '+hm(e.next[0])+'  '+e.next[2]:''}
  function showOsd(){fillOsd();layer('lv-osd',true);clearTimeout(osdT);osdT=setTimeout(function(){layer('lv-osd',false)},5500)}
  function loadEpg(ids,cb){
    ids=ids.filter(function(i){return i});if(!ids.length){cb&&cb();return}
    api('/api/live/epg?ids='+encodeURIComponent(ids.join(','))).then(function(x){for(var k in x)epgNow[k]=x[k];if(byNum[cur]&&ids.indexOf(byNum[cur].id)>=0)fillOsd();cb&&cb()}).catch(function(){cb&&cb()})}
  setInterval(function(){if(o.on&&byNum[cur])loadEpg([byNum[cur].id])},30000);
  var full={};
  function listFor(g){return g===0?chans:chans.filter(function(c){return c.group===groups[g-1]})}
  function gcolor(){var n=L.g===0?'all':groups[L.g-1],c=hsl2rgb(hashHue(n),.5,.42);$('lv-glow').style.setProperty('--c',c.join(','))}
  function openList(){
    L.open=true;var c=byNum[cur];L.g=0;
    if(c&&c.group){var gi=groups.indexOf(c.group);if(gi>=0)L.g=gi+1}
    L.list=listFor(L.g);L.ci=Math.max(0,L.list.indexOf(c));drawList();$('lv').classList.add('gd');layer('lv-guide',true);fetchVisible()}
  function closeList(){L.open=false;$('lv').classList.remove('gd');layer('lv-guide',false)}
  function pct(p,now){return Math.max(0,Math.min(100,(now-p[0])/(p[1]-p[0])*100))}
  function drawList(){
    var now=Math.floor(Date.now()/1000),names=[t('All channels')].concat(groups);
    $('lv-gtitle').textContent=t('Live TV');
    var d=new Date(),tabs='';
    if(L.g>0)tabs+='<div class="ctab m">\u2039</div><div class="ctab">'+lesc(names[L.g-1])+'</div>';
    tabs+='<div class="ctab on">'+lesc(names[L.g])+'</div>';
    if(L.g<names.length-1)tabs+='<div class="ctab">'+lesc(names[L.g+1])+'</div><div class="ctab m">\u203A</div>';
    $('lv-gtabs').innerHTML=tabs;
    $('lv-gclock').textContent=d.toLocaleTimeString(LOC,clockOpts());gcolor();
    var N=7,cs=Math.max(0,Math.min(L.ci-3,L.list.length-N)),h='';
    for(var j=cs;j<Math.min(L.list.length,cs+N);j++){
      var c=L.list[j],e=epgNow[c.id],pn=e&&e.now;
      h+='<div class="crow'+(j===L.ci?' f':'')+(c.num===cur?' cur':'')+'"><div class="n">'+c.num+'</div>'+(c.logo?'<img class="lg" src="'+lesc(c.logo)+'" alt="">':'<div class="lg"></div>')
        +'<div class="t"><div class="nm">'+lesc(c.name)+'</div><div class="nw">'+(pn?lesc(hm(pn[0])+'  '+pn[2]):(e?'':lesc(t('No guide data'))))+'</div>'
        +(pn?'<div class="pbar"><i style="width:'+pct(pn,now)+'%"></i></div>':'')+'</div></div>'}
    $('lv-rows').innerHTML=h;drawDetail()}
  function drawDetail(){
    var c=L.list[L.ci];if(!c){$('lv-detail').innerHTML='';return}
    var f=full[c.id],now=Math.floor(Date.now()/1000),h='<div class="dn">'+lesc(c.name)+'</div><div class="dg">'+lesc(c.group||'')+'</div>';
    if(f&&f.list&&f.list.length){
      var p=f.list[0],live=p[0]<=now;
      h+='<div class="card"><div class="dt">'+lesc(hm(p[0])+' – '+hm(p[1]))+(live?'':'')+'</div><div class="dp">'+lesc(p[2])+'</div>'+(p[3]?'<div class="dd">'+lesc(p[3])+'</div>':'')+(live?'<div class="pbar"><i style="width:'+pct(p,now)+'%"></i></div>':'')+'</div>';
      if(f.list.length>1){h+='<h3>'+t('Later')+'</h3>';for(var i=1;i<Math.min(5,f.list.length);i++)h+='<div class="up"><div class="tm">'+hm(f.list[i][0])+'</div><div class="tt">'+lesc(f.list[i][2])+'</div></div>'}}
    else h+='<div class="card"><div class="dt">'+lesc(f?t('No guide data'):'…')+'</div></div>';
    $('lv-detail').innerHTML=h}
  function fetchVisible(){
    clearTimeout(fetchT);fetchT=setTimeout(function(){
      var cs=Math.max(0,Math.min(L.ci-3,L.list.length-7)),ids=L.list.slice(cs,cs+7).map(function(c){return c.id}).filter(function(i){return i&&!epgNow[i]});
      if(ids.length)loadEpg(ids,function(){if(L.open)drawList()});
      var c=L.list[L.ci];if(c&&c.id&&!full[c.id])api('/api/live/epg?full=1&ids='+encodeURIComponent(c.id)).then(function(x){full[c.id]=x[c.id]||{list:[]};if(L.open)drawDetail()}).catch(function(){})},160)}
  function digit(d){
    numBuf+=d;if(numBuf.length>5)numBuf=numBuf.slice(-5);
    $('lv-numin').textContent=numBuf;layer('lv-numin',true);clearTimeout(numT);
    numT=setTimeout(function(){var n=parseInt(numBuf,10);numBuf='';layer('lv-numin',false);if(byNum[n])play(n);else showOsd()},1800)}
  function setup(){
    api('/api/live/pair',{}).then(function(p){
      msg('<b>'+t('Set up Live TV')+'</b><div>'+t('Open this address on your phone or computer:')+'</div><b>'+lesc(p.url)+'</b><div>'+t('and enter this code:')+'</div><b>'+lesc(p.code)+'</b><div class="small">'+t('Then paste your M3U playlist address. This page closes by itself.')+'</div>');
      clearInterval(setupT);setupT=setInterval(function(){if(!o.on){clearInterval(setupT);return}api('/api/live/status').then(function(s){if(s.configured){clearInterval(setupT);boot()}})},2500)})}
  function boot(){
    msg('<div>'+t('Loading channels...')+'</div>');
    api('/api/live/status').then(function(s){
      if(!s.configured){setup();return}
      var tries=0;
      (function load(){
        if(!o.on)return;
        api('/api/live/channels').then(function(x){
          if(!x.channels.length){if(++tries>40){msg('<div>'+lesc(s.error||'No channels')+'</div>');return}setTimeout(load,2000);return}
          groups=x.groups;chans=x.channels.map(function(r){return {num:r[0],id:r[1],name:r[2],group:r[3],logo:r[4],url:r[5]}});
          byNum={};chans.forEach(function(c){byNum[c.num]=c});loaded=true;
          var last=0;try{last=parseInt(localStorage.getItem('live.last'),10)}catch(e){}
          layer('lv-msg',false);play(byNum[last]?last:chans[0].num)})
      })()
    }).catch(function(){msg('<div>'+t('The helper is not reachable.')+'</div>');setTimeout(function(){if(o.on)boot()},3000)})}
  function step(d){var i=chans.indexOf(byNum[cur]);i=(i+d+chans.length)%chans.length;play(chans[i].num)}
  o.enter=function(){o.on=true;$('lv').classList.add('on');if(loaded&&byNum[cur])play(cur);else boot()};
  o.exit=function(){o.on=false;closeList();full={};stop();clearTimeout(osdT);clearTimeout(numT);clearInterval(setupT);layer('lv-osd',false);layer('lv-numin',false);layer('lv-msg',false);layer('lv-spin',false);$('lv').classList.remove('on')};
  o.key=function(e){
    var k=e.keyCode;e.preventDefault();
    if(!loaded){if(k===461||k===27||k===8)o.exit();return}
    if(L.open){
      var n7=7;
      if(k===38){if(L.ci>0)L.ci--}
      else if(k===40){if(L.ci<L.list.length-1)L.ci++}
      else if(k===33||k===427){L.ci=Math.max(0,L.ci-n7)}
      else if(k===34||k===428){L.ci=Math.min(L.list.length-1,L.ci+n7)}
      else if(k===37){if(L.g>0){L.g--;L.list=listFor(L.g);L.ci=0}}
      else if(k===39){if(L.g<groups.length){L.g++;L.list=listFor(L.g);L.ci=0}}
      else if(k===13){if(L.list[L.ci]){var n=L.list[L.ci].num;closeList();play(n);return}}
      else if(k===461||k===27||k===8){closeList();return}
      else if(k>=48&&k<=57){closeList();digit(k-48);return}
      else return;
      drawList();fetchVisible();return}
    if(k===13){if(failed)play(cur);else openList()}
    else if(k===38||k===33||k===427)step(1);
    else if(k===40||k===34||k===428)step(-1);
    else if(k===457||k===37||k===39)showOsd();
    else if(k>=48&&k<=57)digit(k-48);
    else if(k>=96&&k<=105)digit(k-96);
    else if(k===461||k===27||k===8)o.exit()};
  return o})();

/* first paint straight from the last known layout, then refresh from the helper */
try{var cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
  if(cached&&cached.apps&&cached.apps.length){apps=cached.apps;cfg=cached.cfg||{};usage=cached.usage||{};colors=cached.colors||{};rebuild()}}catch(e){}
if(LIVE_ONLY){var liveExit=LIVE.exit;LIVE.exit=function(){liveExit();if(!QUIET)api('/api/launch',{id:'com.webos.app.home'})}}
load();wantInputs();
api('/api/frontend-ok',{version:VERSION}).catch(function(){});   // lets the manager know an updated launcher started
</script></body></html>
