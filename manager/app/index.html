ave empty to use the playlist's":"leeg laten om die van de afspeellijst te gebruiken","Lets other devices on your network send picture notifications to this TV with a POST request and a secret token. Off by default.":"Laat andere apparaten in je netwerk fotomeldingen naar deze TV sturen met een POST-verzoek en een geheim token. Standaard uit.","LG’s guide again":"weer LG’s gids","LG’s guide stays":"LG’s gids blijft","LG’s own assistant reacts to the same button and sends the audio to LG. On: it is paused while voice is on. A reboot or switching this off undoes it.":"LG’s eigen assistent reageert op dezelfde knop en stuurt de audio naar LG. Aan: hij is gepauzeerd zolang spraak aan staat. Een herstart of dit uitzetten maakt het ongedaan.","LG’s own list: CleanYourTV is not the Home":"LG’s eigen lijst: CleanYourTV is niet de Home","Listen on the voice button":"Luisteren op de spraakknop","listening…":"luisteren…","Listening…":"Luisteren…","Live TV":"Live TV","Live TV is off":"Live TV staat uit","Live TV setup":"Live TV instellen","Live TV: your own playlist":"Live TV: je eigen afspeellijst","loading guide":"gids laden","loading playlist":"afspeellijst laden","Loading the model list…":"Modellenlijst laden…","Local uploads":"Lokale uploads","Local uploads: %d · Immich: %d · Total: %d photos (%d of 150 MB)":"Lokale uploads: %d · Immich: %d · Totaal: %d foto’s (%d van 150 MB)","Looking for the dev build…":"Dev-build zoeken…","Looks for a newer release on GitHub. Nothing is installed until you choose an update.":"Zoekt een nieuwere release op GitHub. Er wordt niets geïnstalleerd tot je een update kiest.","Manage from your phone":"Beheren met je telefoon","Model":"Model","Model: %s":"Model: %s","More":"Meer","needs service %s or newer; update the service first":"heeft service %s of nieuwer nodig; werk eerst de service bij","Network notifications":"Netwerkmeldingen","never":"nooit","New token":"Nieuw token","New token created. Open “How to send” to see it.":"Nieuw token gemaakt. Open ‘Hoe te versturen’ om het te zien.","no answer":"geen antwoord","no channels found in that playlist":"geen zenders gevonden in die afspeellijst","no key set":"geen sleutel ingesteld","no release published yet":"nog geen release gepubliceerd","No release yet":"Nog geen release","No, keep it":"Nee, bewaren","none published right now":"nu niet gepubliceerd","not a JPEG, PNG or WebP picture":"geen JPEG-, PNG- of WebP-afbeelding","not a picture the TV can show":"geen afbeelding die de TV kan tonen","not available":"niet beschikbaar","not available on this firmware":"niet beschikbaar op deze firmware","not connected":"niet verbonden","Not connected.":"Niet verbonden.","Not found":"Niet gevonden","not installed":"niet geïnstalleerd","not learned":"niet geleerd","not paused yet":"nog niet gepauzeerd","not set":"niet ingesteld","not set · shows a card only":"niet ingesteld · toont alleen een kaart","Nothing changes.":"Er verandert niets.","nothing to remove":"niets te verwijderen","Nothing was pressed.":"Er is niets ingedrukt.","Notification address and token":"Meldingsadres en token","now: %s":"nu: %s","Off":"Uit","On":"Aan","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"Aan: op Input drukken toont onze ingangenlijst. Uit: LG’s kiezer komt meteen terug.","On: pressing the button you learned starts listening. A card shows what was heard.":"Aan: de geleerde knop indrukken start het luisteren. Een kaart toont wat er gehoord is.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"Aan: de Home-knop opent deze launcher. Uit: LG’s eigen Home. Wisselen herstart de TV (ongeveer een minuut); de service blijft hoe dan ook draaien.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"Aan: de launcher heeft een Live TV-knop en -tegel, de ingangenlijst heeft Live TV, en de gidstoets kan de zendergids openen. Uit: dat alles is verborgen en LG’s eigen speler en gids worden gebruikt. Je afspeellijst blijft bewaard.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Aan: de TV luistert op poort 8767 naar POST /notify met het token. Iedereen met het token en toegang tot het netwerk kan kaarten op dit scherm tonen.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Aan: wat je zegt, gaat ook als tekst naar een taalmodel via OpenRouter en het antwoord verschijnt op het scherm. Vraagt je OpenRouter-sleutel; de tekst gaat naar OpenRouter en de modelaanbieder, nooit audio.","one is saved, leave empty to keep it":"er is er een opgeslagen, leeg laten om die te houden","Open":"Openen","OpenRouter key":"OpenRouter-sleutel","optional":"optioneel","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Optioneel. Legt de code van de Home-knop vast. De Home-knop blijft precies werken zoals eerst.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Optioneel. Spreek in de afstandsbediening en de TV zet het op de TV zelf om in tekst (Moonshine, Engels). De tekst kan naar een server van jou. Audio verlaat de TV nooit. Vraagt een download van ongeveer 80 MB.","over the running app, ready in the background (instant)":"over de lopende app, klaar op de achtergrond (direct)","over the running app, started when pressed":"over de lopende app, gestart bij indrukken","Photo %d of %d · preparing":"Foto %d van %d · voorbereiden","Photo %d of %d · sending":"Foto %d van %d · versturen","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Foto’s uit de Immich-albums die je koos, elke zes uur naar de TV gedownload (en met Nu synchroniseren), zodat Home nooit op Immich wacht. Hooguit 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Foto’s geüpload met een telefoon, bewaard op de TV. Hooguit 100.","Picture size":"Fotogrootte","Playlist":"Afspeellijst","Playlist address (M3U)":"Adres van de afspeellijst (M3U)","Playlist removed":"Afspeellijst verwijderd","Playlist saved":"Afspeellijst opgeslagen","Preparing the report…":"Rapport voorbereiden…","Preparing…":"Voorbereiden…","Press and hold the text, then choose Copy":"Houd de tekst ingedrukt en kies Kopiëren","Press the %s button now…":"Druk nu op de %s-knop…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Zet het dock, de knoppen bovenaan, verborgen apps, de volgorde en de klok terug naar de standaard. Het thema blijft.","QR code for your phone":"QR-code voor je telefoon","Reading status…":"Status lezen…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Leest de code van de Input-knop van je afstandsbediening uit de hook en test dan of onze lijst opent. De standaard is 241. Wissen gaat daarheen terug.","Recent":"Recent","Recent channels cleared":"Recente zenders gewist","recommended first · installed %s":"eerst aanbevolen · geïnstalleerd %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Legt de code vast van de knop die het luisteren start. Probeer eerst de microfoonknop; elke vrije knop werkt.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Legt de code van de Guide-knop vast. Daarna opent hij de Live TV-gids over wat er ook draait (alleen als Live TV aan staat). Wis hem om LG’s gids terug te krijgen.","Refresh playlist and guide":"Afspeellijst en gids vernieuwen","Refreshing in the background":"Wordt op de achtergrond vernieuwd","Refreshing…":"Vernieuwen…","refused":"geweigerd","reloaded":"opnieuw geladen","Remove all uploads":"Alle uploads verwijderen","Remove CleanYourTV?":"CleanYourTV verwijderen?","Remove the playlist":"Afspeellijst verwijderen","Remove the playlist?":"Afspeellijst verwijderen?","Remove voice":"Spraak verwijderen","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Verwijdert de apps, de opstartscripts en je instellingen en herstart dan de TV, zodat LG’s Home terugkomt.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"CleanYourTV wordt verwijderd… de TV start zo opnieuw op en LG’s Home komt terug.","Reset Home customisation":"Aanpassingen van Home herstellen","Restarting the service":"Service herstarten","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Herstart de TV; daarna is LG’s eigen Home de Home. Je kunt hier terugschakelen.","Restarts the TV; this launcher is Home after it starts.":"Herstart de TV; daarna is deze launcher Home.","Running apps":"Geopende apps","Save":"Opslaan","Save albums and sync":"Albums opslaan en synchroniseren","Saved":"Opgeslagen","Saved. The TV is loading your channels now; you can close this page.":"Opgeslagen. De TV laadt nu je zenders; je kunt deze pagina sluiten.","Saved. You can close this page.":"Opgeslagen. Je kunt deze pagina sluiten.","scan with a phone to copy the address and token":"scan met een telefoon om adres en token te kopiëren","Select all":"Alles selecteren","selected":"gekozen","Send the text to":"Tekst sturen naar","Send the text to your own server":"De tekst naar je eigen server sturen","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Stuurt wat je zegt als tekst naar Assist van Home Assistant en toont het antwoord. Vraagt het adres en een langlevend toegangstoken (profielpagina van Home Assistant), ingevuld op je telefoon. Deze rij kiezen test de verbinding.","Server token":"Servertoken","Service %s":"Service %s","Set up anyway":"Toch instellen","set up from your phone":"instellen met je telefoon","Set up from your phone":"Instellen met je telefoon","set up Home Assistant first":"stel eerst Home Assistant in","Set up Live TV":"Live TV instellen","Set up now":"Nu instellen","Set up with commands":"Instellen met commando’s","Setting up… %s":"Instellen… %s","Setting up… the screen blinks once while LG’s system restarts":"Instellen… het scherm knippert één keer terwijl LG’s systeem herstart","Settings":"Instellingen","settings and apps are deleted; the TV restarts":"instellingen en apps worden verwijderd; de TV start opnieuw op","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Instellingen voor Live TV: aan of uit, je afspeellijst instellen of verwijderen, de gids vernieuwen en de gidstoets leren.","Share log":"Log delen","Share the log":"Log delen","Show as QR code":"Als QR-code tonen","Show Live TV":"Live TV tonen","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Toont een QR-code. Een telefoon die hem scant, opent een pagina die de TV tien minuten aanbiedt, met het meldingsadres en het token en Kopiëren-knoppen (bijvoorbeeld voor Home Assistant). Het token is geheim.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Toont een QR-code. Op de telefoonpagina upload je foto’s (die op de telefoon de juiste grootte krijgen), verwijder je uploads, verbind je Immich, kies je albums en verberg je losse foto’s.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Toont een QR-code. Scan hem met een telefoon op hetzelfde wifi-netwerk om een rapport voor een foutmelding te kopiëren. Adressen en URL-paden zijn verborgen; de pagina sluit na tien minuten.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Toont een QR-code. Scan hem met een telefoon op hetzelfde wifi-netwerk om je OpenRouter-sleutel in te vullen, een model te kiezen, instructies te schrijven en een serveradres in te stellen. Er wordt niets op de TV getypt.","Shows the address, the token and an example request.":"Toont het adres, het token en een voorbeeldverzoek.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Toont de commando’s om sleutel, model en instructies vanuit een shell in te stellen, en hoe je met tekst iets vraagt.","Skip":"Overslaan","Speak now…":"Spreek nu…","speak when the card appears":"spreek als de kaart verschijnt","Stable releases":"Stabiele releases","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Stabiele releases zijn wat de meeste mensen willen: hooguit één per dag, gemaakt van de dev-builds. Dev-builds komen met elke wijziging en kunnen minder af zijn; kies hier Dev en installeer met de rijen Launcher en Service. Terug naar Stabiel biedt weer de nieuwste release aan.","Start":"Start","Starting":"Starten","Starts listening without the button: speak when the card appears.":"Start het luisteren zonder de knop: spreek als de kaart verschijnt.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Stopt contentminer en nudge (aanbevelingen en pop-uptips) en houdt sportsalarm tegen bij het starten.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stopt de advertentie-, aanbevelings- en telemetriediensten van LG en blokkeert een paar advertentieservers. Er wordt niets verwijderd, en het geldt alleen zolang deze launcher Home is.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stopt de advertentie-, volg-, telemetrie- en suggestiediensten van LG, in vier groepen die je los kunt schakelen. Er wordt niets verwijderd, en het geldt alleen zolang deze launcher Home is.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Stopt remotelogger en service-logger, die logs verzamelen en naar LG sturen.","Stream":"Stream","streams":"streams","Suggestions and nudges":"Suggesties en duwtjes","Swaps the previous launcher version back in. The newer one stays available as an update.":"Zet de vorige launcherversie terug. De nieuwere blijft beschikbaar als update.","Switch all off":"Alles uitzetten","Switch all on":"Alles aanzetten","Switch Home?":"Home wisselen?","Switch notifications on first":"Zet eerst meldingen aan","Switch off LG’s voice assistant":"LG’s spraakassistent uitzetten","Switches every group on.":"Zet elke groep aan.","Switches the debloat off: the services start again and the hosts lines are removed.":"Zet de debloat uit: de diensten starten weer en de hosts-regels worden verwijderd.","switching restarts the TV":"overschakelen herstart de TV","Switching to CleanYourTV… the TV restarts in a moment.":"Overschakelen naar CleanYourTV… de TV start zo opnieuw op.","Switching to LG’s Home… the TV restarts in a moment.":"Overschakelen naar LG’s Home… de TV start zo opnieuw op.","Switching…":"Overschakelen…","Sync now":"Nu synchroniseren","synced %s":"gesynchroniseerd %s","Synced photos":"Gesynchroniseerde foto’s","Syncing with Immich…":"Synchroniseren met Immich…","syncing…":"synchroniseren…","Syncing…":"Synchroniseren…","syncing… %d new":"synchroniseren… %d nieuw","Syncing… %d new":"Synchroniseren… %d nieuw","Take over the Input key":"Ingangtoets overnemen","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Tik op Kopiëren en plak het in je bericht. Adressen en URL-paden zijn verborgen. Deze pagina sluit tien minuten nadat hij op de TV is geopend.","tap to hide or show one":"tik om er een te verbergen of te tonen","Telemetry logs":"Telemetrielogs","Test connection and save":"Verbinding testen en opslaan","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nDruk nog een keer op de Input-knop. Onze ingangenlijst hoort over dit scherm te openen.","Testing":"Testen","the address must start with http:// or https://":"het adres moet beginnen met http:// of https://","the address, the channel list, the guide and your favourites are deleted":"het adres, de zenderlijst, de gids en je favorieten worden verwijderd","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"De AI en Home Assistant onthouden de laatste beurten tien minuten. Dit wist ze.","The AI only":"Alleen de AI","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"De achtergronddienst achter de launcher: Live TV, fotomeldingen, de ingangtoets, deze updates. Een mislukte update zet de vorige bestanden terug.","the chosen albums have no photos the TV can show":"de gekozen albums hebben geen foto’s die de TV kan tonen","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"De gidstoets.\nKies Start en druk dan op de Guide-knop van je afstandsbediening. Die opent daarna de Live TV-gids in plaats van LG’s gids. Wis hem om LG’s gids terug te krijgen.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"De Home-toets (optioneel).\nKies Start en druk dan op de Home-knop van je afstandsbediening.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Het startscherm dat je ziet. Updates komen van GitHub-releases en worden gecontroleerd met een SHA-256-bestand voor ze worden geïnstalleerd. Start een nieuwe launcher niet, dan komt de vorige terug.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"De hook koppelde niet op deze firmware, dus toetsen kunnen niet geleerd worden. De ingangtoets blijft bij LG’s kiezer.\nMeld dit via Log delen.","The Input key.\nChoose Start, then press the Input button on your remote.":"De ingangtoets.\nKies Start en druk dan op de Input-knop van je afstandsbediening.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"De ingangenlijst opende niet.\nAls LG’s eigen kiezer verscheen, is de ingangtoets niet gekoppeld: leer hem opnieuw of zet de ingangtoets uit.","The Inputs list opened: the Input key works.":"De ingangenlijst opende: de ingangtoets werkt.","the install did not finish":"de installatie is niet afgerond","the key is forgotten and its photos are deleted from the TV":"de sleutel wordt vergeten en de foto’s worden van de TV verwijderd","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"De taal van de schermen van CleanYourTV: de launcher, deze app en de ingangenlijst. Automatisch volgt de menutaal van de TV. Het percentage zegt hoeveel van een taal vertaald is; de rest blijft Engels. Vertalingen zijn bestanden in de repository waar iedereen aan kan bijdragen.","the launcher’s Inputs list":"de ingangenlijst van de launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"De eigen instellingen van de launcher gaan terug naar de standaard. Apps, het thema en alles in deze app blijven.","The new launcher did not start; rolling back":"De nieuwe launcher startte niet; terugzetten","the new launcher did not start; the previous version is back":"de nieuwe launcher startte niet; de vorige versie is terug","The notification listener is not running.":"De meldingenluisteraar draait niet.","the old one stops working":"het oude werkt niet meer","The page has closed. Close this and try again.":"De pagina is gesloten. Sluit dit en probeer het opnieuw.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"De pagina is tien minuten open. Hij toont versies, het installatielog en het servicelog; adressen en URL-paden zijn verborgen.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"De pagina is tien minuten open. Hij is niet versleuteld: het token gaat over je wifi, dus gebruik een netwerk dat je vertrouwt.","The page stays open for ten minutes, /* ---------- language: the pages are written in English and translated where text is shown ----------

   The language is the TV's, unless the manager's Language setting chose another (setLang). t() looks a text up whole, then the parts
   of a text joined by line breaks or " · ", and fills in templates: "%s" is any text, "%d" a number ("Launcher %s", "%d photos").
   A text without a translation stays English. A translation can have plural forms, {"one": "%d foto", "other": "%d foto's"}: the
   form follows the first number in the text, by the language's plural rules (Unicode CLDR: zero, one, two, few, many, other). The

var LANG_TV = String((window.webOSSystem && window.webOSSystem.locale) || navigator.language || 'en')

function setLang(code) {

  LT = I18N[LANG] || null;
  LTPL = null;
  if (document.documentElement) {
    document.documentElement.lang = LANG;
    /* a right-to-left language (_dir "rtl": Arabic, Hebrew) mirrors the layout; the pages' CSS has the [dir="rtl"] rules */
    document.documentElement.dir = LT && LT._dir === 'rtl' ? 'rtl' : 'ltr';
  }
}
/* left and right swap places in a right-to-left layout: the arrow keys follow what the eye sees */

/* the plural form of n in the current language: the browser's rules, or a small table of the same rules for older engines */
function pluralForm(n) {

    if (window.Intl && Intl.PluralRules) return new Intl.PluralRules(LANG).select(n);
  } catch (e) {}

    m10 = i % 10,
    m100 = i % 100;

  if (/^(fr|pt)$/.test(LANG)) return i < 2 ? 'one' : 'other';
  if (/^(ru|uk|be)$/.test(LANG))
    return m10 === 1 && m100 !== 11 ? 'one' : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'few' : 'many';
  if (LANG === 'pl') return i === 1 ? 'one' : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'few' : 'many';
  if (/^(cs|sk)$/.test(LANG)) return i === 1 ? 'one' : i >= 2 && i <= 4 ? 'few' : 'other';
  if (LANG === 'ar')
    return i === 0 ? 'zero' : i === 1 ? 'one' : i === 2 ? 'two' : m100 >= 3 && m100 <= 10 ? 'few' : m100 >= 11 ? 'many' : 'other';

            k

    x.onload = function () {

        res(JSON.parse(x.responseText));
      } catch (e) {
        rej(e);
      }

/* the debloat's four groups (scripts/debloat-stop.sh); options.debloatOff lists the ones switched off */
var DEBLOAT = [
  { id: 'ads', label: 'Ads', what: 'ad services and ad servers' },
  { id: 'tracking', label: 'Viewing tracking (LivePlus)', what: 'acr2' },
  { id: 'logs', label: 'Telemetry logs', what: 'remotelogger, service-logger' },
  { id: 'suggestions', label: 'Suggestions and nudges', what: 'contentminer, nudge, sportsalarm' },
];
function debloatOn(id) {
  var o = st.options || {};
  return o.debloat !== false && (o.debloatOff || []).indexOf(id) < 0;
}
/* switching the last group off switches the debloat off; one group on while it is off switches it on with only that group */
function debloatToggle(id) {
  var o = st.options || {},
    off = (o.debloatOff || []).slice();
  if (debloatOn(id)) {
    off.push(id);
    return opt(off.length >= DEBLOAT.length ? { debloat: false, debloatOff: [] } : { debloatOff: off });
  }
  if (o.debloat === false)
    return opt({
      debloat: true,
      debloatOff: DEBLOAT.map(function (g) {
        return g.id;
      }).filter(function (g) {
        return g !== id;
      }),
    });
  opt({
    debloatOff: off.filter(function (g) {
      return g !== id;
    }),
  });
}

/* before the setup (or when it failed) the service is not running: update the package through the root service instead */
function execOut(m) {

function offlineCheck() {

    var e = execOut(m),
      r = null;
    try {
      r = JSON.parse(e.out);
    } catch (x) {}
    if (!r || r.error) {
      banner('Could not check: ' + ((r && r.error) || e.err || 'no answer'), 'err');
      return;
    }
    upd = r.updateTo ? r : null;
    build();
    if (upd) idx = updIdx;
    draw();
    banner(
      r.updateTo ? 'Version ' + r.updateTo + ' is available; this one is ' + r.installed + '.' : 'Up to date (' + r.installed + ').',

function offlineUpdate() {
  if (!upd) return;

    function () {

function pollUpdate(n) {
  rootExec('tail -n 3 /tmp/cytv-selfupdate.log 2>/dev/null').then(function (m) {
    var t = execOut(m).out.trim(),
      last = t.split('\n').pop();

      upd = null;

      build();

      return;
    }
    if (/^ERROR/.test(last)) {
      banner('Update failed: ' + last.replace(/^ERROR /, ''), 'err');
      return;
    }
    if (n > 120) {
      banner('The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.', 'err');
      return;

    }, 2000);
  });

function drawQr(url) {
  var q = qrcode(0, 'M');
  q.addData(url);
  q.make();
  var n = q.getModuleCount(),
    cell = Math.max(4, Math.floor(640 / (n + 8))),
    cv = $('qr'),
    size = cell * (n + 8),
    g;
  cv.width = cv.height = size;
  g = cv.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + 4) * cell, (r + 4) * cell, cell, cell);
}
