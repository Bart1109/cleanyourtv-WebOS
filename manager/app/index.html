oken erstellt. Öffne „So wird gesendet“, um es zu sehen.","no answer":"keine Antwort","no channels found in that playlist":"keine Sender in dieser Playlist gefunden","no key set":"kein Schlüssel eingerichtet","no release published yet":"noch keine Version veröffentlicht","No release yet":"Noch keine Version","No, keep it":"Nein, behalten","none published right now":"gerade keiner veröffentlicht","not a JPEG, PNG or WebP picture":"kein JPEG-, PNG- oder WebP-Bild","not a picture the TV can show":"kein Bild, das der Fernseher zeigen kann","not available":"nicht verfügbar","not available on this firmware":"auf dieser Firmware nicht verfügbar","not connected":"nicht verbunden","Not connected.":"Nicht verbunden.","Not found":"Nicht gefunden","not installed":"nicht installiert","not learned":"nicht gelernt","not paused yet":"noch nicht pausiert","not set":"nicht eingerichtet","not set · shows a card only":"nicht eingerichtet · zeigt nur eine Karte","Nothing changes.":"Es ändert sich nichts.","nothing to remove":"nichts zu entfernen","Nothing was pressed.":"Es wurde nichts gedrückt.","Notification address and token":"Benachrichtigungsadresse und Token","now: %s":"jetzt: %s","Off":"Aus","On":"An","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"An: Input zeigt unsere Eingangsliste. Aus: LGs Auswahl ist sofort zurück.","On: pressing the button you learned starts listening. A card shows what was heard.":"An: Die gelernte Taste startet das Zuhören. Eine Karte zeigt, was gehört wurde.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"An: Die Home-Taste öffnet diesen Launcher. Aus: LGs eigenes Home. Umschalten startet den Fernseher neu (etwa eine Minute); der Dienst läuft in beiden Fällen weiter.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"An: Der Launcher hat eine Live-TV-Schaltfläche und -Kachel, die Eingangsliste hat Live-TV, und die Guide-Taste kann den Programmführer öffnen. Aus: All das ist ausgeblendet und LGs eigener Player und Programmführer werden genutzt. Deine Playlist bleibt erhalten.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"An: Der Fernseher lauscht auf Port 8767 auf POST /notify mit dem Token. Wer das Token und Netzwerkzugang hat, kann Karten auf diesem Bildschirm zeigen.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"An: Was du sagst, geht auch als Text über OpenRouter an ein Sprachmodell, und die Antwort erscheint auf dem Bildschirm. Braucht deinen OpenRouter-Schlüssel; der Text geht an OpenRouter und den Modellanbieter, nie Audio.","one is saved, leave empty to keep it":"eines ist gespeichert, leer lassen zum Behalten","Open":"Öffnen","OpenRouter key":"OpenRouter-Schlüssel","optional":"optional","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Optional. Speichert den Code der Home-Taste. Die Home-Taste funktioniert genau wie vorher.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Optional. Sprich in die Fernbedienung, und der Fernseher macht daraus auf dem Gerät selbst Text (Moonshine, Englisch). Der Text kann an einen eigenen Server gehen. Audio verlässt den Fernseher nie. Braucht einen Download von etwa 80 MB.","over the running app, ready in the background (instant)":"über der laufenden App, im Hintergrund bereit (sofort)","over the running app, started when pressed":"über der laufenden App, beim Drücken gestartet","Photo %d of %d · preparing":"Foto %d von %d · wird vorbereitet","Photo %d of %d · sending":"Foto %d von %d · wird gesendet","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Fotos aus den gewählten Immich-Alben, alle sechs Stunden auf den Fernseher geladen (und mit Jetzt synchronisieren), damit Home nie auf Immich wartet. Höchstens 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Mit dem Handy hochgeladene Fotos, auf dem Fernseher gespeichert. Höchstens 100.","Picture size":"Bildgröße","Playlist":"Playlist","Playlist address (M3U)":"Adresse der Playlist (M3U)","Playlist removed":"Playlist entfernt","Playlist saved":"Playlist gespeichert","Preparing the report…":"Bericht wird vorbereitet…","Preparing…":"Wird vorbereitet…","Press and hold the text, then choose Copy":"Halte den Text gedrückt und wähle Kopieren","Press the %s button now…":"Drücke jetzt die %s-Taste…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Setzt Dock, obere Schaltflächen, ausgeblendete Apps, Reihenfolge und Uhr auf den Standard zurück. Das Design bleibt.","QR code for your phone":"QR-Code für dein Handy","Reading status…":"Status wird gelesen…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Liest den Code der Input-Taste deiner Fernbedienung aus dem Hook und testet dann, ob unsere Liste aufgeht. Standard ist 241. Löschen geht dorthin zurück.","Recent":"Zuletzt","Recent channels cleared":"Letzte Sender gelöscht","recommended first · installed %s":"zuerst empfohlen · installiert %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Speichert den Code der Taste, die das Zuhören startet. Probiere zuerst die Mikrofontaste; jede freie Taste geht.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Speichert den Code der Guide-Taste. Danach öffnet sie den Live-TV-Programmführer über allem, was läuft (nur wenn Live-TV an ist). Lösche sie, um LGs Programmführer zurückzubekommen.","Refresh playlist and guide":"Playlist und Programmführer aktualisieren","Refreshing in the background":"Wird im Hintergrund aktualisiert","Refreshing…":"Wird aktualisiert…","refused":"abgelehnt","reloaded":"neu geladen","Remove all uploads":"Alle Uploads entfernen","Remove CleanYourTV?":"CleanYourTV entfernen?","Remove the playlist":"Playlist entfernen","Remove the playlist?":"Playlist entfernen?","Remove voice":"Sprachsteuerung entfernen","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Entfernt die Apps, die Startskripte und deine Einstellungen und startet dann den Fernseher neu, damit LGs Home zurückkommt.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"CleanYourTV wird entfernt… der Fernseher startet gleich neu und LGs Home ist zurück.","Reset Home customisation":"Home-Anpassungen zurücksetzen","Restarting the service":"Dienst wird neu gestartet","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Startet den Fernseher neu; danach ist LGs eigenes Home das Home. Du kannst hier zurückwechseln.","Restarts the TV; this launcher is Home after it starts.":"Startet den Fernseher neu; danach ist dieser Launcher das Home.","Running apps":"Geöffnete Apps","Save":"Speichern","Save albums and sync":"Alben speichern und synchronisieren","Saved":"Gespeichert","Saved. The TV is loading your channels now; you can close this page.":"Gespeichert. Der Fernseher lädt jetzt deine Sender; du kannst diese Seite schließen.","Saved. You can close this page.":"Gespeichert. Du kannst diese Seite schließen.","scan with a phone to copy the address and token":"mit dem Handy scannen, um Adresse und Token zu kopieren","Select all":"Alles auswählen","selected":"ausgewählt","Send the text to":"Text senden an","Send the text to your own server":"Den Text an deinen eigenen Server senden","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Sendet das Gesagte als Text an Home Assistants Assist und zeigt die Antwort. Braucht die Adresse und ein langlebiges Zugangstoken (Profilseite in Home Assistant), am Handy eingegeben. Diese Zeile zu wählen testet die Verbindung.","Server token":"Server-Token","Service %s":"Dienst %s","Set up anyway":"Trotzdem einrichten","set up from your phone":"mit dem Handy einrichten","Set up from your phone":"Mit dem Handy einrichten","set up Home Assistant first":"zuerst Home Assistant einrichten","Set up Live TV":"Live-TV einrichten","Set up now":"Jetzt einrichten","Set up with commands":"Mit Befehlen einrichten","Setting up… %s":"Einrichtung… %s","Setting up… the screen blinks once while LG’s system restarts":"Einrichtung… der Bildschirm blinkt einmal, während LGs System neu startet","Settings":"Einstellungen","settings and apps are deleted; the TV restarts":"Einstellungen und Apps werden gelöscht; der Fernseher startet neu","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Einstellungen für Live-TV: an oder aus, Playlist einrichten oder entfernen, Programmführer aktualisieren und Guide-Taste lernen.","Share log":"Protokoll teilen","Share the log":"Protokoll teilen","Show as QR code":"Als QR-Code zeigen","Show Live TV":"Live-TV anzeigen","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Zeigt einen QR-Code. Ein Handy, das ihn scannt, öffnet eine Seite, die der Fernseher zehn Minuten bereitstellt, mit Benachrichtigungsadresse und Token samt Kopieren-Schaltflächen (zum Beispiel für Home Assistant). Das Token ist geheim.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Zeigt einen QR-Code. Auf der Handy-Seite lädst du Fotos hoch (sie bekommen auf dem Handy die richtige Größe), löschst Uploads, verbindest Immich, wählst Alben und blendest einzelne Fotos aus.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Zeigt einen QR-Code. Scanne ihn mit einem Handy im selben WLAN, um einen Bericht für eine Fehlermeldung zu kopieren. Adressen und URL-Pfade sind maskiert; die Seite schließt nach zehn Minuten.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Zeigt einen QR-Code. Scanne ihn mit einem Handy im selben WLAN, um deinen OpenRouter-Schlüssel einzugeben, ein Modell zu wählen, Anweisungen zu schreiben und eine Serveradresse festzulegen. Auf dem Fernseher wird nichts getippt.","Shows the address, the token and an example request.":"Zeigt Adresse, Token und eine Beispielanfrage.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Zeigt die Befehle, um Schlüssel, Modell und Anweisungen aus einer Shell einzurichten, und wie man per Text fragt.","Skip":"Überspringen","Speak now…":"Jetzt sprechen…","speak when the card appears":"sprich, wenn die Karte erscheint","Stable releases":"Stabile Versionen","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Stabile Versionen sind das, was die meisten wollen: höchstens eine pro Tag, aus den Dev-Builds gemacht. Dev-Builds kommen mit jeder Änderung und können weniger fertig sein; wähle hier Dev und installiere mit den Zeilen Launcher und Dienst. Zurück zu Stabil bietet wieder die neueste Version an.","Start":"Start","Starting":"Wird gestartet","Starts listening without the button: speak when the card appears.":"Startet das Zuhören ohne Taste: Sprich, wenn die Karte erscheint.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Stoppt contentminer und nudge (Empfehlungen und Pop-up-Tipps) und verhindert den Start von sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stoppt LGs Werbe-, Empfehlungs- und Telemetriedienste und sperrt einige Werbeserver. Es wird nichts deinstalliert, und es gilt nur, solange dieser Launcher das Home ist.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stoppt LGs Werbe-, Tracking-, Telemetrie- und Vorschlagsdienste, in vier Gruppen, die du einzeln schalten kannst. Es wird nichts deinstalliert, und es gilt nur, solange dieser Launcher das Home ist.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Stoppt remotelogger und service-logger, die Protokolle sammeln und an LG senden.","Stream":"Stream","streams":"Streams","Suggestions and nudges":"Vorschläge und Hinweise","Swaps the previous launcher version back in. The newer one stays available as an update.":"Setzt die vorige Launcher-Version wieder ein. Die neuere bleibt als Update verfügbar.","Switch all off":"Alles ausschalten","Switch all on":"Alles einschalten","Switch Home?":"Home wechseln?","Switch notifications on first":"Zuerst Benachrichtigungen einschalten","Switch off LG’s voice assistant":"LGs Sprachassistenten ausschalten","Switches every group on.":"Schaltet jede Gruppe ein.","Switches the debloat off: the services start again and the hosts lines are removed.":"Schaltet den Debloat aus: Die Dienste starten wieder und die Hosts-Zeilen werden entfernt.","switching restarts the TV":"Umschalten startet den Fernseher neu","Switching to CleanYourTV… the TV restarts in a moment.":"Wechsel zu CleanYourTV… der Fernseher startet gleich neu.","Switching to LG’s Home… the TV restarts in a moment.":"Wechsel zu LGs Home… der Fernseher startet gleich neu.","Switching…":"Wird umgestellt…","Sync now":"Jetzt synchronisieren","synced %s":"synchronisiert %s","Synced photos":"Synchronisierte Fotos","Syncing with Immich…":"Synchronisierung mit Immich…","syncing…":"wird synchronisiert…","Syncing…":"Synchronisierung…","syncing… %d new":"wird synchronisiert… %d neu","Syncing… %d new":"Synchronisierung… %d neu","Take over the Input key":"Eingangstaste übernehmen","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Tippe auf Kopieren und füge es in deine Nachricht ein. Adressen und URL-Pfade sind maskiert. Diese Seite schließt zehn Minuten nach dem Öffnen auf dem Fernseher.","tap to hide or show one":"tippen zum Aus- oder Einblenden","Telemetry logs":"Telemetrie-Protokolle","Test connection and save":"Verbindung testen und speichern","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nDrücke die Input-Taste noch einmal. Unsere Eingangsliste sollte sich über diesem Bildschirm öffnen.","Testing":"Wird getestet","the address must start with http:// or https://":"die Adresse muss mit http:// oder https:// beginnen","the address, the channel list, the guide and your favourites are deleted":"Adresse, Senderliste, Programmführer und Favoriten werden gelöscht","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"Die KI und Home Assistant merken sich die letzten Beiträge zehn Minuten. Dies löscht sie.","The AI only":"Nur die KI","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Der Hintergrunddienst hinter dem Launcher: Live-TV, Bildbenachrichtigungen, die Eingangstaste, diese Updates. Ein fehlgeschlagenes Update stellt die vorigen Dateien wieder her.","the chosen albums have no photos the TV can show":"die gewählten Alben haben keine Fotos, die der Fernseher zeigen kann","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"Die Guide-Taste.\nWähle Start und drücke dann die Guide-Taste auf deiner Fernbedienung. Sie öffnet danach den Live-TV-Programmführer statt LGs. Lösche sie, um LGs Programmführer zurückzubekommen.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"Die Home-Taste (optional).\nWähle Start und drücke dann die Home-Taste auf deiner Fernbedienung.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Der Startbildschirm, den du siehst. Updates kommen aus GitHub-Versionen und werden vor der Installation mit einer SHA-256-Datei geprüft. Startet ein neuer Launcher nicht, kommt der vorige zurück.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Der Hook hat sich auf dieser Firmware nicht verbunden, daher können keine Tasten gelernt werden. Die Eingangstaste bleibt bei LGs Auswahl.\nMelde dies über Protokoll teilen.","The Input key.\nChoose Start, then press the Input button on your remote.":"Die Eingangstaste.\nWähle Start und drücke dann die Input-Taste auf deiner Fernbedienung.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"Die Eingangsliste wurde nicht geöffnet.\nWenn LGs eigene Auswahl erschien, ist die Eingangstaste nicht zugeordnet: Lerne sie erneut oder schalte die Eingangstaste aus.","The Inputs list opened: the Input key works.":"Die Eingangsliste wurde geöffnet: Die Eingangstaste funktioniert.","the install did not finish":"die Installation wurde nicht abgeschlossen","the key is forgotten and its photos are deleted from the TV":"der Schlüssel wird vergessen und die Fotos werden vom Fernseher gelöscht","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"Die Sprache der Anzeigen von CleanYourTV: der Launcher, diese App und die Eingangsliste. Automatisch folgt der Menüsprache des Fernsehers. Der Prozentsatz zeigt, wie viel einer Sprache übersetzt ist; der Rest bleibt Englisch. Übersetzungen sind Dateien im Repository, zu denen jeder beitragen kann.","the launcher’s Inputs list":"die Eingangsliste des Launchers","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Die eigenen Einstellungen des Launchers gehen auf den Standard zurück. Apps, das Design und alles in dieser App bleiben.","The new launcher did not start; rolling back":"Der neue Launcher startete nicht; Rückkehr zur alten Version","the new launcher did not start; the previous version is back":"der neue Launcher startete nicht; die vorige Version ist zurück","The notification listener is not running.":"Der Benachrichtigungsempfang läuft nicht.","the old one stops working":"das alte funktioniert nicht mehr","The page has closed. Close this and try again.":"Die Seite wurde geschlossen. Schließe dies und versuche es erneut.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"Die Seite ist zehn Minuten geöffnet. Sie zeigt Versionen, das Einrichtungs- und das Dienstprotokoll; Adressen und URL-Pfade sind maskiert.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"Die Seite ist zehn Minuten offen. Sie ist nicht verschlüsselt: Das Token geht über dein WLAN, also nutze ein Netzwerk, dem du vertraust.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"Die Seite bleibt zehn Minuten offen oder bis du speicherst. Sie ist nicht verschlüsselt: Der Schlüssel geht über dein WLAN, also nutze ein Netzwerk, dem du vertraust.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"Die Seite bleibt zehn Minuten offen. Sie ist nicht verschlüsselt: Die Playlist-Adresse, die einen Zugangsschlüssel enthalten kann, geht über dein WLAN.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"Die Seite bleibt offen, solange du sie nutzt, höchstens eine Stunde. Sie ist nicht verschlüsselt: Fotos und Immich-Schlüssel gehen über dein WLAN.","the phone page could not start: %s":"die Handy-Seite konnte nicht starten: %s","the picture is larger than 12 MB":"das Bild ist größer als 12 MB","The playlist address must start with http:// or https://":"Die Playlist-Adresse muss mit http:// oder https:// beginnen","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"Die Input-Taste der Fe  150 MB)":"Subidas locales: %d · Immich: %d · Total: %d fotos (%d de 150 MB)","Looking for the dev build…":"Buscando la versión dev…","Looks for a newer release on GitHub. Nothing is installed until you choose an update.":"Busca una versión más nueva en GitHub. No se instala nada hasta que elijas una actualización.","Manage from your phone":"Gestionar desde tu móvil","Model":"Modelo","Model: %s":"Modelo: %s","More":"Más","needs service %s or newer; update the service first":"necesita el servicio %s o más nuevo; actualiza primero el servicio","Network notifications":"Notificaciones de red","never":"nunca","New token":"Nuevo token","New token created. Open “How to send” to see it.":"Nuevo token creado. Abre «Cómo enviar» para verlo.","no answer":"sin respuesta","no channels found in that playlist":"no se encontraron canales en esa lista","no key set":"sin clave","no release published yet":"aún no hay ninguna versión publicada","No release yet":"Aún no hay versión","No, keep it":"No, mantenerla","none published right now":"ninguna publicada ahora","not a JPEG, PNG or WebP picture":"no es una imagen JPEG, PNG o WebP","not a picture the TV can show":"no es una imagen que el televisor pueda mostrar","not available":"no disponible","not available on this firmware":"no disponible en este firmware","not connected":"no conectado","Not connected.":"No conectado.","Not found":"No encontrado","not installed":"no instalado","not learned":"no aprendido","not paused yet":"aún no en pausa","not set":"sin configurar","not set · shows a card only":"sin configurar · solo muestra una tarjeta","Nothing changes.":"No cambia nada.","nothing to remove":"nada que quitar","Nothing was pressed.":"No se pulsó nada.","Notification address and token":"Dirección y token de notificación","now: %s":"ahora: %s","Off":"Desactivado","On":"Activado","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"Activado: Input muestra nuestra lista de entradas. Desactivado: vuelve enseguida el selector de LG.","On: pressing the button you learned starts listening. A card shows what was heard.":"Activado: pulsar el botón aprendido empieza a escuchar. Una tarjeta muestra lo que se oyó.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"Activado: el botón Inicio abre este launcher. Desactivado: el Inicio de LG. Cambiar reinicia el televisor (alrededor de un minuto); el servicio sigue funcionando en ambos casos.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"Activado: el launcher tiene un botón y un mosaico de TV en directo, la lista de entradas tiene TV en directo y el botón Guía puede abrir la guía. Desactivado: todo eso se oculta y se usan el reproductor y la guía de LG. Tu lista se conserva.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Activado: el televisor escucha en el puerto 8767 peticiones POST /notify con el token. Cualquiera con el token y acceso a la red puede mostrar tarjetas en esta pantalla.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Activado: lo que dices también se envía como texto a un modelo de lenguaje a través de OpenRouter y la respuesta aparece en pantalla. Necesita tu clave de OpenRouter; el texto va a OpenRouter y al proveedor del modelo, nunca el audio.","one is saved, leave empty to keep it":"hay uno guardado, déjalo vacío para mantenerlo","Open":"Abrir","OpenRouter key":"Clave de OpenRouter","optional":"opcional","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Opcional. Guarda el código del botón Home. El botón Home sigue funcionando igual que antes.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Opcional. Habla al mando y el televisor lo convierte en texto en el propio aparato (Moonshine, inglés). El texto puede enviarse a un servidor tuyo. El audio nunca sale del televisor. Necesita una descarga de unos 80 MB.","over the running app, ready in the background (instant)":"sobre la app en uso, lista en segundo plano (al instante)","over the running app, started when pressed":"sobre la app en uso, se inicia al pulsar","Photo %d of %d · preparing":"Foto %d de %d · preparando","Photo %d of %d · sending":"Foto %d de %d · enviando","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Fotos de los álbumes de Immich que elegiste, descargadas al televisor cada seis horas (y con Sincronizar ahora), para que Inicio nunca espere a Immich. Como máximo 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Fotos subidas desde el móvil, guardadas en el televisor. Como máximo 100.","Picture size":"Tamaño de imagen","Playlist":"Lista","Playlist address (M3U)":"Dirección de la lista (M3U)","Playlist removed":"Lista quitada","Playlist saved":"Lista guardada","Preparing the report…":"Preparando el informe…","Preparing…":"Preparando…","Press and hold the text, then choose Copy":"Mantén pulsado el texto y elige Copiar","Press the %s button now…":"Pulsa ahora el botón %s…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Devuelve el dock, los botones superiores, las apps ocultas, el orden y el reloj a los valores predeterminados. El tema se queda.","QR code for your phone":"código QR para tu móvil","Reading status…":"Leyendo el estado…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Lee el código del botón Input de tu mando desde el hook y luego comprueba que se abre nuestra lista. El predeterminado es 241. Borrar vuelve a él.","Recent":"Recientes","Recent channels cleared":"Canales recientes borrados","recommended first · installed %s":"recomendado primero · instalada %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Guarda el código del botón que empieza a escuchar. Prueba primero el botón del micrófono; vale cualquier botón libre.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Guarda el código del botón Guide. Después abre la guía de TV en directo sobre lo que esté en marcha (solo con la TV en directo activada). Bórralo para recuperar la guía de LG.","Refresh playlist and guide":"Actualizar lista y guía","Refreshing in the background":"Actualizando en segundo plano","Refreshing…":"Actualizando…","refused":"rechazada","reloaded":"recargado","Remove all uploads":"Quitar todas las subidas","Remove CleanYourTV?":"¿Quitar CleanYourTV?","Remove the playlist":"Quitar la lista","Remove the playlist?":"¿Quitar la lista?","Remove voice":"Quitar la voz","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Quita las apps, los scripts de arranque y tus ajustes y reinicia el televisor para que vuelva el Inicio de LG.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"Quitando CleanYourTV… el televisor se reinicia en un momento y vuelve el Inicio de LG.","Reset Home customisation":"Restablecer la personalización de Inicio","Restarting the service":"Reiniciando el servicio","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Reinicia el televisor; después el Inicio de LG es el Inicio. Puedes volver a cambiar aquí.","Restarts the TV; this launcher is Home after it starts.":"Reinicia el televisor; después este launcher es el Inicio.","Running apps":"Apps abiertas","Save":"Guardar","Save albums and sync":"Guardar álbumes y sincronizar","Saved":"Guardado","Saved. The TV is loading your channels now; you can close this page.":"Guardado. El televisor está cargando tus canales; puedes cerrar esta página.","Saved. You can close this page.":"Guardado. Puedes cerrar esta página.","scan with a phone to copy the address and token":"escanea con el móvil para copiar la dirección y el token","Select all":"Seleccionar todo","selected":"elegido","Send the text to":"Enviar el texto a","Send the text to your own server":"Enviar el texto a tu propio servidor","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Envía lo que dices como texto a Assist de Home Assistant y muestra su respuesta. Necesita la dirección y un token de acceso de larga duración (página de perfil de Home Assistant), introducidos en el móvil. Elegir esta fila prueba la conexión.","Server token":"Token del servidor","Service %s":"Servicio %s","Set up anyway":"Configurar de todos modos","set up from your phone":"configurar desde tu móvil","Set up from your phone":"Configurar desde tu móvil","set up Home Assistant first":"configura primero Home Assistant","Set up Live TV":"Configurar TV en directo","Set up now":"Configurar ahora","Set up with commands":"Configurar con comandos","Setting up… %s":"Configurando… %s","Setting up… the screen blinks once while LG’s system restarts":"Configurando… la pantalla parpadea una vez mientras se reinicia el sistema de LG","Settings":"Ajustes","settings and apps are deleted; the TV restarts":"se borran los ajustes y las apps; el televisor se reinicia","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Ajustes de TV en directo: activarla o no, configurar o quitar tu lista, actualizar la guía y aprender el botón Guía.","Share log":"Compartir el registro","Share the log":"Compartir el registro","Show as QR code":"Mostrar como código QR","Show Live TV":"Mostrar TV en directo","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Muestra un código QR. Un móvil que lo escanee abre una página que el televisor sirve diez minutos, con la dirección de notificación y el token con botones Copiar (por ejemplo para Home Assistant). El token es secreto.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Muestra un código QR. En la página del móvil subes fotos (se ajustan al tamaño adecuado en el móvil), borras subidas, conectas Immich, eliges álbumes y ocultas fotos sueltas.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Muestra un código QR. Escanéalo con un móvil en la misma wifi para copiar un informe para un fallo. Direcciones y rutas de URL están ocultas; la página se cierra tras diez minutos.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Muestra un código QR. Escanéalo con un móvil en la misma wifi para introducir tu clave de OpenRouter, elegir un modelo, escribir instrucciones y fijar una dirección de servidor. No se escribe nada en el televisor.","Shows the address, the token and an example request.":"Muestra la dirección, el token y una petición de ejemplo.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Muestra los comandos para fijar la clave, el modelo y las instrucciones desde un shell, y cómo preguntar por texto.","Skip":"Omitir","Speak now…":"Habla ahora…","speak when the card appears":"habla cuando aparezca la tarjeta","Stable releases":"Versiones estables","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Las versiones estables son lo que quiere la mayoría: como mucho una al día, hecha a partir de las versiones dev. Las versiones dev llegan con cada cambio y pueden estar menos acabadas; elige Dev aquí e instala con las filas Launcher y Servicio. Volver a Estable ofrece de nuevo la última versión.","Start":"Empezar","Starting":"Iniciando","Starts listening without the button: speak when the card appears.":"Empieza a escuchar sin el botón: habla cuando aparezca la tarjeta.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Detiene contentminer y nudge (recomendaciones y consejos emergentes) e impide que arranque sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Detiene los servicios de anuncios, recomendaciones y telemetría de LG y bloquea algunos servidores de anuncios. No se desinstala nada, y solo se aplica mientras este launcher es el Inicio.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Detiene los servicios de anuncios, seguimiento, telemetría y sugerencias de LG, en cuatro grupos que puedes activar por separado. No se desinstala nada, y solo se aplica mientras este launcher es el Inicio.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Detiene remotelogger y service-logger, que recogen registros y los envían a LG.","Stream":"Emisión","streams":"emisiones","Suggestions and nudges":"Sugerencias y avisos","Swaps the previous launcher version back in. The newer one stays available as an update.":"Vuelve a poner la versión anterior del launcher. La más nueva sigue disponible como actualización.","Switch all off":"Desactivar todo","Switch all on":"Activar todo","Switch Home?":"¿Cambiar Inicio?","Switch notifications on first":"Activa primero las notificaciones","Switch off LG’s voice assistant":"Desactivar el asistente de voz de LG","Switches every group on.":"Activa todos los grupos.","Switches the debloat off: the services start again and the hosts lines are removed.":"Desactiva el debloat: los servicios vuelven a arrancar y se quitan las líneas de hosts.","switching restarts the TV":"cambiar reinicia el televisor","Switching to CleanYourTV… the TV restarts in a moment.":"Cambiando a CleanYourTV… el televisor se reinicia en un momento.","Switching to LG’s Home… the TV restarts in a moment.":"Cambiando al Inicio de LG… el televisor se reinicia en un momento.","Switching…":"Cambiando…","Sync now":"Sincronizar ahora","synced %s":"sincronizado %s","Synced photos":"Fotos sincronizadas","Syncing with Immich…":"Sincronizando con Immich…","syncing…":"sincronizando…","Syncing…":"Sincronizando…","syncing… %d new":{"one":"sincronizando… %d nueva","other":"sincronizando… %d nuevas"},"Syncing… %d new":{"one":"Sincronizando… %d nueva","other":"Sincronizando… %d nuevas"},"Take over the Input key":"Tomar el botón Entrada","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Toca Copiar y pégalo en tu mensaje. Las direcciones y rutas de URL están ocultas. Esta página se cierra diez minutos después de abrirse en el televisor.","tap to hide or show one":"toca para ocultar o mostrar una","Telemetry logs":"Registros de telemetría","Test connection and save":"Probar la conexión y guardar","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Prueba.\nPulsa una vez más el botón Input. Nuestra lista de entradas debería abrirse sobre esta pantalla.","Testing":"Probando","the address must start with http:// or https://":"la dirección debe empezar por http:// o https://","the address, the channel list, the guide and your favourites are deleted":"se borran la dirección, la lista de canales, la guía y tus favoritos","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"La IA y Home Assistant recuerdan los últimos turnos durante diez minutos. Esto los borra.","The AI only":"Solo la IA","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"El servicio en segundo plano tras el launcher: TV en directo, notificaciones con imagen, el botón Entrada, estas actualizaciones. Una actualización fallida restaura los archivos anteriores.","the chosen albums have no photos the TV can show":"los álbumes elegidos no tienen fotos que el televisor pueda mostrar","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"El botón Guía.\nElige Empezar y pulsa el botón Guide del mando. Después abrirá la guía de TV en directo en lugar de la de LG. Bórralo para recuperar la guía de LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"El botón Inicio (opcional).\nElige Empezar y pulsa el botón Home del mando.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"La pantalla de inicio que ves. Las actualizaciones vienen de las versiones de GitHub y se comprueban con un archivo SHA-256 antes de instalarse. Si un launcher nuevo no arranca, vuelve el anterior.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"El hook no se conectó en este firmware, así que no se pueden aprender botones. El botón Entrada sigue con el selector de LG.\nInfórmalo con Compartir el registro.","The Input key.\nChoose Start, then press the Input button on your remote.":"El botón Entrada.\nElige Empezar y pulsa el botón Input del mando.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"No se abrió la lista de entradas.\nSi apareció el selector de LG, el botón Entrada no está asignado: apréndelo de nuevo o desactiva el botón Entrada.","The Inputs list opened: the Input key works.":"Se abrió la lista de entradas: el botón Entrada funciona.","the install did not finish":"la instalación no terminó","the key is forgotten and its photos are deleted from the TV":"se olvida la clave y sus fotos se borran del televisor","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"El idioma de las pantallas de CleanYourTV: el launcher, esta app y la lista de entradas. Automático sigue el idioma de los menús del televisor. El porcentaje indica cuánto de un idioma está traducido; el resto sigue en inglés. Las traducciones son archivos del repositorio a los que cualquiera puede contribuir.","the launcher’s Inputs list":"la lista de entradas del launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Los ajustes propios del launcher vuelven a los predeterminados. Las apps, el tema y todo lo de esta app se quedan.","The new launcher did not start; rolling back":"El nuevo launcher no arrancó; volviendo atrás","the new launcher did not start; the previous version is back":"el nuevo launcher no arrancó; vuelve la versión anterior","The notification listener is not running.":"La escucha de notificaciones no está en marcha.","the old one stops working":"el anterior deja de funcionar","The page has closed. Close this and try again.":"La página se ha cerrado. Cierra esto y vuelve a intentarlo.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"La página está abierta diez minutos. Muestra las versiones, el registro de instalación y el del servicio; direcciones y rutas de URL están ocultas.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"La página se abre diez minutos. No está cifrada: el token viaja por tu wifi, así que usa una red de confianza.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"La página sigue abierta diez minutos o hasta que guardes. No está cifrada: la clave viaja por tu wifi, así que usa una red de confianza.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"La página sigue abierta diez minutos. No está cifrada: la dirección de la lista, que puede incluir una clave de acceso, viaja por tu wifi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"La página sigue abierta mientras la usas, como máximo una hora. No está cifrada: tus fotos y la clave de Immich viajan por tu wifi.","the phone page could not start: %s":"la página del móvil no pudo iniciarse: %s","the picture is larger than 12 MB":"la imagen ocupa más de 12 MB","The playlist address must start with http:// or https://":"La dirección de la lista debe empezar por http:// o https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"El botón Input del mando abre nuestra lista de entradas en lugar del selector de LG. Puedes cambiarlo después.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"El botón Input del mando abre nuestra lista de entradas sobre la app en uso en lugar del selector de LG. Abre esta pantalla para desactivarlo o aprender el botón.","the screen blinks once":"la pantalla parpadea una vez","The service did not answer":"El servicio no respondió","The service did not answer.":"El servicio no respondió.","The service is not running. Set it up to replace LG’s Home, take over the Input key and keep everything up to date.":"El servicio no está en marcha. Configúralo para sustituir el Inicio de LG, tomar el botón Entrada y mantener todo actualizado.","The TV did not answer.":"El televisor no respondió.","The TV did not answer. Is the phone on the same Wi-Fi?":"El televisor no respondió. ¿Está el móvil en la misma wifi?","the TV restarts":"el televisor se reinicia","The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.":"La actualización tarda demasiado. Registro: /tmp/cytv-selfupdate.log en el televisor.","the uploaded photos are deleted from the TV":"las fotos subidas se borran del televisor","The voice button.\nChoose Start, then press the button you want to use for voice. The remote’s microphone button may not reach the hook; any spare button works.":"El botón de voz.\nElige Empezar y pulsa el botón que quieras usar para la voz. Puede que el botón del micrófono no llegue al hook; vale cualquier  stays with LG). Choose to go to the next one.":"Comment le bouton Input affiche les entrées. Par-dessus l’app en cours, prête en arrière-plan : instantané, testé sur webOS 25. Par-dessus l’app en cours, lancée à l’appui : rien ne tourne en caché, elle ne peut donc pas garder la télécommande ; le choix par défaut sur les anciens webOS, où la version en arrière-plan affichait un cercle de chargement. La liste d’entrées du launcher : le téléviseur va sur notre accueil (nécessite CleanYourTV comme accueil ; sinon la touche reste à LG). Choisissez pour passer à la suivante.","How to send":"Comment envoyer","Immich":"Immich","Immich answered %d":"Immich a répondu %d","Immich disconnected":"Immich déconnecté","Immich disconnected.":"Immich déconnecté.","Immich refused the API key (needs album.read and asset.read/view)":"Immich a refusé la clé API (il faut album.read et asset.read/view)","Immich: new and changed photos":"Immich : photos nouvelles et modifiées","Input":"Input","Input key":"Touche Entrée","Input key cleared.\nIt uses the default code (%s).":"Touche Entrée effacée.\nElle utilise le code par défaut (%s).","Input key opens our Inputs list":"La touche Entrée ouvre notre liste d’entrées","Input key shows":"La touche Entrée affiche","Inputs":"Entrées","Install failed: %s":"Échec de l’installation : %s","Install voice":"Installer la voix","Installing launcher %s":"Installation du launcher %s","Installing service %s":"Installation du service %s","installing…":"installation…","Installs the launcher, replaces LG’s Home at boot and starts the service. About a minute; the screen blinks once. If the new Home does not come up, the setup removes itself and restarts the TV.":"Installe le launcher, remplace l’accueil de LG au démarrage et lance le service. Environ une minute ; l’écran clignote une fois. Si le nouvel accueil ne démarre pas, la configuration se retire et redémarre le téléviseur.","Instructions for the AI":"Instructions pour l’IA","just now":"à l’instant","Keep ela.","LG’s own list: CleanYourTV is not the Home":"la liste de LG : CleanYourTV n’est pas l’accueil","Listen on the voice button":"Écouter sur le bouton voix","listening…":"écoute…","Listening…":"Écoute…","Live TV":"TV en direct","Live TV is off":"La TV en direct est désactivée","Live TV setup":"Configuration de la TV en direct","Live TV: your own playlist":"TV en direct : votre propre playlist","loading guide":"chargement du guide","loading playlist":"chargement de la playlist","Loading the model list…":"Chargement de la liste des modèles…","Local uploads":"Envois locaux","Local uploads: %d · Immich: %d · Total: %d photos (%d of 150 MB)":"Envois locaux : %d · Immich : %d · Total : %d photos (%d sur 150 Mo)","Looking for the dev build…":"Recherche de la version dev…","Looks for a newer release on GitHub. Nothing is installed until you choose an update.":"Cherche une version plus récente sur GitHub. Rien n’est installé tant que vous ne choisissez pas une mise à jour.","Manage from your phone":"Gérer depuis votre téléphone","Model":"Modèle","Model: %s":"Modèle : %s","More":"Plus","needs service %s or newer; update the service first":"nécessite le service %s ou plus récent ; mettez d’abord le service à jour","Network notifications":"Notifications réseau","never":"jamais","New token":"Nouveau jeton","New token created. Open “How to send” to see it.":"Nouveau jeton créé. Ouvrez « Comment envoyer » pour le voir.","no answer":"pas de réponse","no channels found in that playlist":"aucune chaîne trouvée dans cette playlist","no key set":"aucune clé configurée","no release published yet":"aucune version publiée pour l’instant","No release yet":"Pas encore de version","No, keep it":"Non, la garder","none published right now":"aucune publiée pour l’instant","not a JPEG, PNG or WebP picture":"pas une image JPEG, PNG ou WebP","not a picture the TV can show":"pas une image que le téléviseur peut afficher","not available":"non disponible","not available on this firmware":"non disponible sur ce firmware","not connected":"non connecté","Not connected.":"Non connecté.","Not found":"Introuvable","not installed":"non installé","not learned":"non appris","not paused yet":"pas encore en pause","not set":"non configuré","not set · shows a card only":"non configuré · affiche seulement une carte","Nothing changes.":"Rien ne change.","nothing to remove":"rien à supprimer","Nothing was pressed.":"Rien n’a été appuyé.","Notification address and token":"Adresse et jeton de notification","now: %s":"actuel : %s","Off":"Désactivé","On":"Activé","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"Activé : Input affiche notre liste d’entrées. Désactivé : le sélecteur de LG revient aussitôt.","On: pressing the button you learned starts listening. A card shows what was heard.":"Activé : appuyer sur le bouton appris lance l’écoute. Une carte montre ce qui a été entendu.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"Activé : le bouton Accueil ouvre ce launcher. Désactivé : l’accueil de LG. Changer redémarre le téléviseur (environ une minute) ; le service continue de tourner dans les deux cas.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"Activé : le launcher a un bouton et une tuile TV en direct, la liste d’entrées a la TV en direct, et la touche Guide peut ouvrir le guide. Désactivé : tout cela est masqué et le lecteur et le guide de LG sont utilisés. Votre playlist est conservée.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Activé : le téléviseur écoute sur le port 8767 les POST /notify avec le jeton. Quiconque a le jeton et accès au réseau peut afficher des cartes sur cet écran.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Activé : ce que vous dites est aussi envoyé en texte à un modèle de langage via OpenRouter et la réponse s’affiche. Nécessite votre clé OpenRouter ; le texte va à OpenRouter et au fournisseur du modèle, jamais l’audio.","one is saved, leave empty to keep it":"un est enregistré, laisser vide pour le garder","Open":"Ouvrir","OpenRouter key":"Clé OpenRouter","optional":"facultatif","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Facultatif. Enregistre le code du bouton Home. Le bouton Home fonctionne exactement comme avant.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Facultatif. Parlez dans la télécommande et le téléviseur transforme la voix en texte sur l’appareil (Moonshine, anglais). Le texte peut aller vers votre serveur. L’audio ne quitte jamais le téléviseur. Nécessite un téléchargement d’environ 80 Mo.","over the running app, ready in the background (instant)":"par-dessus l’app en cours, prête en arrière-plan (instantané)","over the running app, started when pressed":"par-dessus l’app en cours, lancée à l’appui","Photo %d of %d · preparing":"Photo %d sur %d · préparation","Photo %d of %d · sending":"Photo %d sur %d · envoi","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Photos des albums Immich choisis, téléchargées sur le téléviseur toutes les six heures (et avec Synchroniser maintenant), pour que l’accueil n’attende jamais Immich. 300 au plus.","Photos uploaded from a phone, kept on the TV. At most 100.":"Photos envoyées depuis un téléphone, gardées sur le téléviseur. 100 au plus.","Picture size":"Taille des images","Playlist":"Playlist","Playlist address (M3U)":"Adresse de la playlist (M3U)","Playlist removed":"Playlist supprimée","Playlist saved":"Playlist enregistrée","Preparing the report…":"Préparation du rapport…","Preparing…":"Préparation…","Press and hold the text, then choose Copy":"Maintenez le texte appuyé, puis choisissez Copier","Press the %s button now…":"Appuyez maintenant sur le bouton %s…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Remet le dock, les boutons du haut, les apps masquées, l’ordre et l’horloge aux réglages par défaut. Le thème reste.","QR code for your phone":"code QR pour votre téléphone","Reading status…":"Lecture de l’état…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Lit le code du bouton Input de votre télécommande depuis le hook, puis vérifie que notre liste s’ouvre. Par défaut 241. Effacer y revient.","Recent":"Récents","Recent channels cleared":"Chaînes récentes effacées","recommended first · installed %s":"recommandé d’abord · installée %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Enregistre le code du bouton qui lance l’écoute. Essayez d’abord le bouton micro ; tout bouton libre convient.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Enregistre le code du bouton Guide. Ensuite, il ouvre le guide de la TV en direct par-dessus ce qui tourne (seulement si la TV en direct est activée). Effacez-le pour retrouver le guide de LG.","Refresh playlist and guide":"Actualiser la playlist et le guide","Refreshing in the background":"Actualisation en arrière-plan","Refreshing…":"Actualisation…","refused":"refusée","reloaded":"rechargé","Remove all uploads":"Supprimer tous les envois","Remove CleanYourTV?":"Supprimer CleanYourTV ?","Remove the playlist":"Supprimer la playlist","Remove the playlist?":"Supprimer la playlist ?","Remove voice":"Supprimer la voix","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Supprime les apps, les scripts de démarrage et vos réglages, puis redémarre le téléviseur pour que l’accueil de LG revienne.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"Suppression de CleanYourTV… le téléviseur redémarre dans un instant et l’accueil de LG revient.","Reset Home customisation":"Réinitialiser la personnalisation de l’accueil","Restarting the service":"Redémarrage du service","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Redémarre le téléviseur ; l’accueil de LG est ensuite l’accueil. Vous pouvez revenir ici.","Restarts the TV; this launcher is Home after it starts.":"Redémarre le téléviseur ; ce launcher est ensuite l’accueil.","Running apps":"Apps ouvertes","Save":"Enregistrer","Save albums and sync":"Enregistrer les albums et synchroniser","Saved":"Enregistré","Saved. The TV is loading your channels now; you can close this page.":"Enregistré. Le téléviseur charge vos chaînes ; vous pouvez fermer cette page.","Saved. You can close this page.":"Enregistré. Vous pouvez fermer cette page.","scan with a phone to copy the address and token":"scannez avec un téléphone pour copier l’adresse et le jeton","Select all":"Tout sélectionner","selected":"choisi","Send the text to":"Envoyer le texte à","Send the text to your own server":"Envoyer le texte à votre propre serveur","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Envoie ce que vous dites en texte à Assist de Home Assistant et affiche sa réponse. Nécessite l’adresse et un jeton d’accès longue durée (page de profil de Home Assistant), saisis sur votre téléphone. Choisir cette ligne teste la connexion.","Server token":"Jeton du serveur","Service %s":"Service %s","Set up anyway":"Configurer quand même","set up from your phone":"configurer depuis votre téléphone","Set up from your phone":"Configurer depuis votre téléphone","set up Home Assistant first":"configurez d’abord Home Assistant","Set up Live TV":"Configurer la TV en direct","Set up now":"Configurer maintenant","Set up with commands":"Configurer par commandes","Setting up… %s":"Configuration… %s","Setting up… the screen blinks once while LG’s system restarts":"Configuration… l’écran clignote une fois pendant le redémarrage du système de LG","Settings":"Paramètres","settings and apps are deleted; the TV restarts":"les réglages et les apps sont supprimés ; le téléviseur redémarre","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Réglages de la TV en direct : l’activer ou non, configurer ou supprimer votre playlist, actualiser le guide et apprendre la touche Guide.","Share log":"Partager le journal","Share the log":"Partager le journal","Show as QR code":"Afficher en code QR","Show Live TV":"Afficher la TV en direct","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Affiche un code QR. Un téléphone qui le scanne ouvre une page servie dix minutes par le téléviseur, avec l’adresse de notification et le jeton et des boutons Copier (pour Home Assistant, par exemple). Le jeton est secret.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Affiche un code QR. Sur la page du téléphone, vous envoyez des photos (mises à la bonne taille sur le téléphone), supprimez des envois, connectez Immich, choisissez des albums et masquez des photos.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Affiche un code QR. Scannez-le avec un téléphone sur le même Wi-Fi pour copier un rapport pour signaler un bug. Adresses et chemins d’URL sont masqués ; la page se ferme après dix minutes.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Affiche un code QR. Scannez-le avec un téléphone sur le même Wi-Fi pour saisir votre clé OpenRouter, choisir un modèle, écrire des instructions et définir une adresse de serveur. Rien n’est tapé sur le téléviseur.","Shows the address, the token and an example request.":"Affiche l’adresse, le jeton et un exemple de requête.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Affiche les commandes pour définir la clé, le modèle et les instructions depuis un shell, et comment poser une question par texte.","Skip":"Passer","Speak now…":"Parlez maintenant…","speak when the card appears":"parlez quand la carte apparaît","Stable releases":"Versions stables","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Les versions stables sont ce que la plupart des gens veulent : au plus une par jour, faite à partir des versions dev. Les versions dev arrivent à chaque changement et peuvent être moins finies ; choisissez Dev ici, puis installez avec les lignes Launcher et Service. Revenir à Stable propose à nouveau la dernière version.","Start":"Démarrer","Starting":"Démarrage","Starts listening without the button: speak when the card appears.":"Lance l’écoute sans le bouton : parlez quand la carte apparaît.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Arrête contentminer et nudge (recommandations et astuces en pop-up) et empêche sportsalarm de démarrer.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Arrête les services de publicité, de recommandation et de télémétrie de LG et bloque quelques serveurs publicitaires. Rien n’est désinstallé, et cela ne s’applique que tant que ce launcher est l’accueil.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Arrête les services de publicité, de suivi, de télémétrie et de suggestions de LG, en quatre groupes réglables séparément. Rien n’est désinstallé, et cela ne s’applique que tant que ce launcher est l’accueil.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Arrête remotelogger et service-logger, qui collectent des journaux et les envoient à LG.","Stream":"Flux","streams":"flux","Suggestions and nudges":"Suggestions et incitations","Swaps the previous launcher version back in. The newer one stays available as an update.":"Remet la version précédente du launcher. La plus récente reste disponible comme mise à jour.","Switch all off":"Tout désactiver","Switch all on":"Tout activer","Switch Home?":"Changer d’accueil ?","Switch notifications on first":"Activez d’abord les notifications","Switch off LG’s voice assistant":"Désactiver l’assistant vocal de LG","Switches every group on.":"Active chaque groupe.","Switches the debloat off: the services start again and the hosts lines are removed.":"Désactive le debloat : les services redémarrent et les lignes hosts sont retirées.","switching restarts the TV":"changer redémarre le téléviseur","Switching to CleanYourTV… the TV restarts in a moment.":"Passage à CleanYourTV… le téléviseur redémarre dans un instant.","Switching to LG’s Home… the TV restarts in a moment.":"Passage à l’accueil de LG… le téléviseur redémarre dans un instant.","Switching…":"Changement…","Sync now":"Synchroniser maintenant","synced %s":"synchronisé %s","Synced photos":"Photos synchronisées","Syncing with Immich…":"Synchronisation avec Immich…","syncing…":"synchronisation…","Syncing…":"Synchronisation…","syncing… %d new":{"one":"synchronisation… %d nouvelle","other":"synchronisation… %d nouvelles"},"Syncing… %d new":{"one":"Synchronisation… %d nouvelle","other":"Synchronisation… %d nouvelles"},"Take over the Input key":"Prendre la touche Entrée","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Touchez Copier, puis collez-le dans votre message. Adresses et chemins d’URL sont masqués. Cette page se ferme dix minutes après son ouverture sur le téléviseur.","tap to hide or show one":"touchez pour masquer ou afficher","Telemetry logs":"Journaux de télémétrie","Test connection and save":"Tester la connexion et enregistrer","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nAppuyez encore une fois sur le bouton Input. Notre liste d’entrées doit s’ouvrir par-dessus cet écran.","Testing":"Test","the address must start with http:// or https://":"l’adresse doit commencer par http:// ou https://","the address, the channel list, the guide and your favourites are deleted":"l’adresse, la liste des chaînes, le guide et vos favoris sont supprimés","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"L’IA et Home Assistant retiennent les derniers échanges dix minutes. Ceci les efface.","The AI only":"L’IA seulement","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Le service en arrière-plan derrière le launcher : TV en direct, notifications avec image, touche Entrée, ces mises à jour. Une mise à jour ratée remet les fichiers précédents.","the chosen albums have no photos the TV can show":"les albums choisis n’ont aucune photo que le téléviseur peut afficher","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"La touche Guide.\nChoisissez Démarrer, puis appuyez sur le bouton Guide de votre télécommande. Il ouvre ensuite le guide de la TV en direct au lieu de celui de LG. Effacez-le pour retrouver le guide de LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"La touche Accueil (facultative).\nChoisissez Démarrer, puis appuyez sur le bouton Home de votre télécommande.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"L’écran d’accueil que vous voyez. Les mises à jour viennent des versions GitHub et sont vérifiées avec un fichier SHA-256 avant l’installation. Si un nouveau launcher ne démarre pas, l’ancien est remis.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Le hook ne s’est pas attaché sur ce firmware, les touches ne peuvent donc pas être apprises. La touche Entrée reste au sélecteur de LG.\nSignalez-le via Partager le journal.","The Input key.\nChoose Start, then press the Input button on your remote.":"La touche Entrée.\nChoisissez Démarrer, puis appuyez sur le bouton Input de votre télécommande.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"La liste d’entrées ne s’est pas ouverte.\nSi le sélecteur de LG est apparu, la touche Entrée n’est pas associée : apprenez-la à nouveau ou désactivez la touche Entrée.","The Inputs list opened: the Input key works.":"La liste d’entrées s’est ouverte : la touche Entrée fonctionne.","the install did not finish":"l’installation ne s’est pas terminée","the key is forgotten and its photos are deleted from the TV":"la clé est oubliée et ses photos sont supprimées du téléviseur","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"La langue des écrans de CleanYourTV : le launcher, cette app et la liste d’entrées. Automatique suit la langue des menus du téléviseur. Le pourcentage indique la part traduite d’une langue ; le reste reste en anglais. Les traductions sont des fichiers du dépôt auxquels chacun peut contribuer.","the launcher’s Inputs list":"la liste d’entrées du launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Les réglages propres du launcher reviennent aux valeurs par défaut. Les apps, le thème et tout ce qui est dans cette app restent.","The new launcher did not start; rolling back":"Le nouveau launcher n’a pas démarré ; retour en arrière","the new launcher did not start; the previous version is back":"le nouveau launcher n’a pas démarré ; la version précédente est de retour","The notification listener is not running.":"L’écoute des notifications ne tourne pas.","the old one stops working":"l’ancien ne fonctionne plus","The page has closed. Close this and try again.":"La page s’est fermée. Fermez ceci et réessayez.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"La page est ouverte dix minutes. Elle liste les versions, le journal d’installation et celui du service ; adresses et chemins d’URL sont masqués.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"La page s’ouvre dix minutes. Elle n’est pas chiffrée : le jeton passe par votre Wi-Fi, utilisez un réseau de confiance.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"La page reste ouverte dix minutes, ou jusqu’à l’enregistrement. Elle n’est pas chiffrée : la clé passe par votre Wi-Fi, utilisez un réseau de confiance.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"La page reste ouverte dix minutes. Elle n’est pas chiffrée : l’adresse de la playlist, qui peut contenir une clé d’accès, passe par votre Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"La page reste ouverte tant que vous l’utilisez, une heure au plus. Elle n’est pas chiffrée : vos photos et la clé Immich passent par votre Wi-Fi.","the phone page could not start: %s":"la page du téléphone n’a pas pu démarrer : %s","the picture is larger than 12 MB":"l’image dépasse 12 Mo","The playlist address must start with http:// or https://":"L’adresse de la playlist doit commencer par http:// ou https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"Le bouton Input de la télécommande ouvre notre liste d’entrées au lieu du sélecteur de LG. Vous pouvez le changer plus tard.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"Le bouton Input de la télécommande ouvre notre liste d’entrées par-dessus l’app en cours au lieu du s y: Home Assistant is not asked. Choose to switch.":"Eerst Home Assistant, dan de AI: Assist krijgt de tekst; begrijpt het die niet, dan antwoordt de AI. Alleen Home Assistant: nooit de AI. Alleen de AI: Home Assistant wordt niet gevraagd. Kies om te wisselen.","Home Assistant only":"Alleen Home Assistant","Home Assistant’s own":"die van Home Assistant","Home is back to the defaults. Open Home to see it.":"Home staat weer op de standaard. Open Home om het te zien.","Home key cleared.":"Home-toets gewist.","How the Input button shows the Inputs. Over the running app, ready in the background: instant, tested on webOS 25. Over the running app, started when pressed: nothing runs hidden, so it cannot keep the remote; the default on older webOS, where the background one showed a loading circle. The launcher’s Inputs list: the TV goes to our Home (needs CleanYourTV as Home; otherwise the key stays with LG). Choose to go to the next one.":"Hoe de Input-knop de ingangen toont. Over de lopende app, klaar op de achtergrond: direct, getest op webOS 25. Over de lopende app, gestart bij indrukken: er draait niets verborgen, dus hij kan de afstandsbediening niet vasthouden; de standaard op oudere webOS, waar de achtergrondversie een laadcirkel toonde. De ingangenlijst van de launcher: de TV gaat naar onze Home (vraagt CleanYourTV als Home; anders blijft de knop bij LG). Kies om naar de volgende te gaan.","How to send":"Hoe te versturen","Immich":"Immich","Immich answered %d":"Immich antwoordde %d","Immich disconnected":"Immich losgekoppeld","Immich disconnected.":"Immich losgekoppeld.","Immich refused the API key (needs album.read and asset.read/view)":"Immich weigerde de API-sleutel (heeft album.read en asset.read/view nodig)","Immich: new and changed photos":"Immich: nieuwe en gewijzigde foto’s","Input":"Input","Input key":"Ingangtoets","Input key cleared.\nIt uses the default code (%s).":"Ingangtoets gewist.\nHij gebruikt de standaardcode (%s).","Input key opens our Inputs list"
